<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#f8fafc" id="metaThemeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="النظام المالي الذكي">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" id="appFavicon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" id="appTouchIcon" href="./icon.svg">
<link rel="manifest" href="./manifest.json">
<title>النظام المالي الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   1. TOKENS — نظام الألوان والمتغيرات (الوضع الفاتح افتراضياً)
   ═══════════════════════════════════════════════════════════════ */
:root, html[data-theme="light"] {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --surface-3: #eef2f7;
  --border: #dde5ef;
  --border-soft: #e8eef5;
  --text: #0f172a;
  --text-2: #334155;
  --muted: #64748b;

  --brand: #4f46e5;
  --brand-soft: rgba(79, 70, 229, 0.09);

  --uzba: #ea580c;
  --uzba-2: #f97316;
  --uzba-soft: rgba(234, 88, 12, 0.10);

  --custody: #0284c7;
  --custody-2: #0ea5e9;
  --custody-soft: rgba(2, 132, 199, 0.10);

  --treasury: #059669;
  --treasury-2: #10b981;
  --treasury-soft: rgba(5, 150, 105, 0.10);

  --debts: #e11d48;
  --debts-2: #f43f5e;
  --debts-soft: rgba(225, 29, 72, 0.10);

  --ok: #059669;
  --ok-soft: rgba(5, 150, 105, 0.10);
  --warn: #d97706;
  --warn-soft: rgba(217, 119, 6, 0.11);
  --danger: #dc2626;
  --danger-soft: rgba(220, 38, 38, 0.10);

  --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 10px 30px -5px rgba(15, 23, 42, 0.12);
  --r-sm: 10px;
  --r: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --ff: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
  --nav-h: 62px;
}

html[data-theme="dark"] {
  --bg: #0a0f1c;
  --surface: #111a2e;
  --surface-2: #16213a;
  --surface-3: #1d2b48;
  --border: #22314f;
  --border-soft: #1a2740;
  --text: #e9eef8;
  --text-2: #b3c0d8;
  --muted: #7f8fad;

  --brand: #6366f1;
  --brand-soft: rgba(99, 102, 241, 0.14);

  --uzba: #f97316;
  --uzba-2: #fb923c;
  --uzba-soft: rgba(249, 115, 22, 0.13);

  --custody: #38bdf8;
  --custody-2: #0ea5e9;
  --custody-soft: rgba(56, 189, 248, 0.13);

  --treasury: #10b981;
  --treasury-2: #34d399;
  --treasury-soft: rgba(16, 185, 129, 0.13);

  --debts: #fb7185;
  --debts-2: #f43f5e;
  --debts-soft: rgba(251, 113, 133, 0.13);

  --ok: #10b981;
  --ok-soft: rgba(16, 185, 129, 0.13);
  --warn: #f59e0b;
  --warn-soft: rgba(245, 158, 11, 0.13);
  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.13);

  --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 12px 34px rgba(0, 0, 0, 0.5);
}

.ctx-uzba     { --accent: var(--uzba);     --accent-2: var(--uzba-2);     --accent-soft: var(--uzba-soft); }
.ctx-custody  { --accent: var(--custody);  --accent-2: var(--custody-2);  --accent-soft: var(--custody-soft); }
.ctx-treasury { --accent: var(--treasury); --accent-2: var(--treasury-2); --accent-soft: var(--treasury-soft); }
.ctx-debts    { --accent: var(--debts);    --accent-2: var(--debts-2);    --accent-soft: var(--debts-soft); }
.ctx-neutral  { --accent: var(--brand);    --accent-2: #818cf8;           --accent-soft: var(--brand-soft); }

/* ═══════════════════════════════════════════════════════════════
   2. BASE & RESET
   ═══════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
body {
  font-family: var(--ff);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.55;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
  overflow-x: clip;
  max-width: 100vw;
}
@media (min-width: 880px) { body { padding-bottom: 24px; } }
h1, h2, h3, h4 { line-height: 1.3; font-weight: 700; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
svg { width: 1em; height: 1em; flex: 0 0 auto; vertical-align: middle; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--accent, var(--brand)); text-decoration: none; }
table { border-collapse: collapse; width: 100%; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
.num { font-variant-numeric: tabular-nums; direction: ltr; display: inline-block; unicode-bidi: isolate; }
.cur { font-size: 0.72em; font-weight: 600; color: var(--muted); margin-inline-start: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ═══════════════════════════════════════════════════════════════
   3. HEADER & NAVIGATION (Mobile-First)
   ═══════════════════════════════════════════════════════════════ */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-soft);
  box-shadow: var(--shadow);
}
.topbar-in {
  max-width: 1280px;
  margin: 0 auto;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: nowrap;
}
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1 1 auto; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 11px;
  display: grid; place-items: center; flex: 0 0 auto;
  background: linear-gradient(135deg, var(--uzba), var(--brand) 55%, var(--treasury));
  color: #fff;
  box-shadow: 0 2px 8px rgba(234, 88, 12, 0.22);
}
.brand-mark svg { width: 18px; height: 18px; }
.brand-txt { min-width: 0; }
.brand-txt h1 {
  font-size: 14px; font-weight: 700; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 6px;
}
.brand-txt span {
  display: block; font-size: 10.5px; color: var(--muted); font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.user-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 8px; border-radius: 99px; font-size: 10.5px; font-weight: 600;
  background: var(--accent-soft); color: var(--accent); cursor: pointer;
}
.topbar-tools {
  margin-inline-start: auto;
  display: flex; align-items: center; gap: 6px; flex: 0 0 auto;
}
.icon-btn {
  position: relative;
  width: 36px; height: 36px; border-radius: 11px;
  display: grid; place-items: center;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-2);
  transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease;
}
.icon-btn:hover { color: var(--text); border-color: var(--muted); }
.icon-btn:active { transform: scale(0.92); }
.icon-btn.active {
  background: var(--accent-soft);
  border-color: color-mix(in srgb, var(--accent) 40%, transparent);
  color: var(--accent);
}
.icon-btn svg { width: 17px; height: 17px; }
.notif-dot {
  position: absolute; top: 5px; inset-inline-start: 5px;
  width: 8px; height: 8px; border-radius: 99px;
  background: var(--danger);
  box-shadow: 0 0 0 2px var(--surface);
}

/* تبويبات الشاشات الكبيرة */
.tabs {
  max-width: 1280px; margin: 0 auto; padding: 0 14px 8px;
  display: none; gap: 6px;
}
@media (min-width: 880px) { .tabs { display: flex; } }
.tab {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 15px; border-radius: 11px;
  font-size: 13px; font-weight: 600; color: var(--muted);
  border: 1px solid transparent; transition: 0.14s;
}
.tab svg { width: 16px; height: 16px; }
.tab:hover { color: var(--text-2); background: var(--surface-2); }
.tab.on {
  color: var(--tab-c, var(--brand));
  background: var(--tab-bg, var(--brand-soft));
  border-color: color-mix(in srgb, var(--tab-c, var(--brand)) 30%, transparent);
}

/* شريط التنقل السفلي للجوال */
.botnav {
  position: fixed; bottom: 0; right: 0; left: 0; z-index: 45;
  display: flex;
  background: color-mix(in srgb, var(--surface) 96%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
  box-shadow: 0 -2px 12px rgba(15, 23, 42, 0.05);
}
@media (min-width: 880px) { .botnav { display: none; } }
.botnav button {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  height: var(--nav-h); color: var(--muted);
  font-size: 10px; font-weight: 600; transition: 0.14s; position: relative;
}
.botnav svg { width: 19px; height: 19px; }
.botnav button.on { color: var(--tab-c, var(--brand)); font-weight: 700; }
.botnav button.on::before {
  content: ''; position: absolute; top: 0; width: 30px; height: 3px;
  border-radius: 0 0 4px 4px; background: var(--tab-c, var(--brand));
}

/* ═══════════════════════════════════════════════════════════════
   4. VAULTS & QUICK ACTIONS — البطاقات السريعة والخزائن
   ═══════════════════════════════════════════════════════════════ */
.vault-strip-wrap {
  max-width: 1280px; margin: 10px auto 0; padding: 0 12px;
}
.vault-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
@media (max-width: 720px) {
  .vault-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
}
.v-box {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-inline-start: 3.5px solid var(--vc, var(--brand));
  border-radius: var(--r);
  padding: 10px 12px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.12s ease, border-color 0.15s ease;
  min-width: 0;
  text-align: start;
}
.v-box:hover { border-color: var(--vc, var(--brand)); }
.v-box:active { transform: scale(0.985); }
.v-box .vh {
  display: flex; align-items: center; gap: 5px;
  font-size: 10.5px; font-weight: 600; color: var(--muted);
}
.v-box .vh svg { width: 13.5px; height: 13.5px; color: var(--vc, var(--brand)); flex: 0 0 auto; }
.v-box .vh span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v-box .vv {
  font-size: clamp(15px, 4vw, 18.5px);
  font-weight: 700;
  margin-top: 3px;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.v-box .vs {
  font-size: 9.5px; color: var(--muted); font-weight: 500;
  margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* أزرار الإضافة السريعة في الرئيسية */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 8px;
}
@media (max-width: 480px) {
  .quick-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
}
.quick-btn {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 11px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  text-align: start; transition: 0.14s;
}
.quick-btn:hover {
  border-color: var(--qc, var(--brand));
  background: color-mix(in srgb, var(--qc, var(--brand)) 8%, var(--surface));
}
.quick-btn:active { transform: scale(0.97); }
.quick-btn .qi {
  width: 32px; height: 32px; border-radius: 9px;
  display: grid; place-items: center; flex: 0 0 auto;
  background: color-mix(in srgb, var(--qc, var(--brand)) 14%, transparent);
  color: var(--qc, var(--brand));
}
.quick-btn .qi svg { width: 16px; height: 16px; }
.quick-btn b { font-size: 12px; font-weight: 700; display: block; line-height: 1.25; }
.quick-btn small { font-size: 9.5px; color: var(--muted); font-weight: 500; display: block; }

/* بطاقة دفتر تجميع الوجبات المستمر */
.staged-card {
  background: linear-gradient(135deg, color-mix(in srgb, var(--uzba) 8%, var(--surface)), var(--surface) 75%);
  border: 1.5px solid color-mix(in srgb, var(--uzba) 35%, var(--border));
  border-radius: var(--r-lg);
  padding: 13px;
  box-shadow: var(--shadow);
}
.meal-presets {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.meal-preset-btn {
  padding: 6px 11px; border-radius: 9px;
  font-size: 12px; font-weight: 700;
  background: var(--surface); border: 1px solid color-mix(in srgb, var(--uzba) 35%, var(--border));
  color: var(--uzba); display: inline-flex; align-items: center; gap: 4px;
  transition: 0.14s;
}
.meal-preset-btn:hover { background: var(--uzba); color: #fff; }
.meal-preset-btn:active { transform: scale(0.96); }

/* ═══════════════════════════════════════════════════════════════
   5. LAYOUT & CONTAINERS
   ═══════════════════════════════════════════════════════════════ */
main { max-width: 1280px; margin: 0 auto; padding: 11px 12px 30px; }
.page { display: none; animation: fadeIn 0.14s ease-out; }
.page.on { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

.stack { display: flex; flex-direction: column; gap: 11px; }
.grid { display: grid; gap: 9px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 820px) {
  .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .g2 { grid-template-columns: 1fr; }
}
.split { display: grid; gap: 11px; grid-template-columns: 1fr; }
@media (min-width: 960px) { .split { grid-template-columns: 1.2fr 0.8fr; } .split.even { grid-template-columns: 1fr 1fr; } }
.grid > *, .split > * { min-width: 0; }

/* ═══════════════════════════════════════════════════════════════
   6. CARDS, HEROES & SUBNAVS
   ═══════════════════════════════════════════════════════════════ */
.card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-lg);
  padding: 13px;
  box-shadow: var(--shadow);
}
.card-h {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; flex-wrap: wrap;
}
.card-h h3 {
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; gap: 6px;
}
.card-h h3 svg { width: 16px; height: 16px; color: var(--accent, var(--brand)); }
.card-h .sub { font-size: 11px; color: var(--muted); font-weight: 500; }
.card-h .right { margin-inline-start: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.pghero {
  position: relative; overflow: hidden;
  border-radius: var(--r-lg);
  border: 1px solid color-mix(in srgb, var(--accent, var(--brand)) 25%, var(--border));
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent, var(--brand)) 8%, var(--surface)), var(--surface) 70%);
  padding: 13px 15px;
  display: grid; gap: 10px; grid-template-columns: 1fr;
  box-shadow: var(--shadow);
}
@media (min-width: 840px) { .pghero { grid-template-columns: 1.15fr 0.85fr; align-items: center; } }
.ph-cap {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; color: var(--accent, var(--brand));
}
.ph-big {
  font-size: clamp(22px, 6.2vw, 31px);
  font-weight: 700; line-height: 1.15; margin-top: 3px;
}
.ph-chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.ph-kpis {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px;
}
.tile {
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: 8px 7px;
  text-align: center;
  min-width: 0;
}
.tile > span {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  font-size: 10px; font-weight: 600; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tile > b {
  display: block; font-size: 13.5px; font-weight: 700; margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tile > small { display: block; font-size: 9.5px; color: var(--muted); margin-top: 1px; }

.subnav { margin-bottom: 10px; overflow: hidden; }
.sn-track {
  display: flex; gap: 6px; overflow-x: auto; padding: 2px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.sn-track::-webkit-scrollbar { display: none; }
.sn-track button {
  display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
  white-space: nowrap; padding: 7px 12px; border-radius: 10px;
  font-size: 12px; font-weight: 600; color: var(--muted);
  background: var(--surface); border: 1px solid var(--border);
  transition: 0.14s;
}
.sn-track button svg { width: 14px; height: 14px; }
.sn-track button.on {
  background: var(--accent, var(--brand));
  color: #fff;
  border-color: var(--accent, var(--brand));
}
.sn-track button em {
  font-style: normal; font-size: 10px; font-weight: 700;
  padding: 1px 6px; border-radius: 99px;
  background: rgba(0, 0, 0, 0.08); color: inherit;
}
.sn-track button.on em { background: rgba(255, 255, 255, 0.24); color: #fff; }

/* ═══════════════════════════════════════════════════════════════
   7. MEMBER BALANCE CARDS (بطاقات أرصدة العزبة)
   ═══════════════════════════════════════════════════════════════ */
.m-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
  gap: 8px;
}
@media (max-width: 480px) {
  .m-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
}
.m-card {
  position: relative;
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 10px 11px;
  display: flex; flex-direction: column; gap: 5px;
}
.m-card.pos-card {
  border-color: color-mix(in srgb, var(--ok) 42%, var(--border));
  background: linear-gradient(145deg, color-mix(in srgb, var(--ok) 7%, var(--surface)), var(--surface));
}
.m-card.neg-card {
  border-color: color-mix(in srgb, var(--danger) 42%, var(--border));
  background: linear-gradient(145deg, color-mix(in srgb, var(--danger) 7%, var(--surface)), var(--surface));
}
.m-top { display: flex; align-items: center; gap: 7px; min-width: 0; }
.m-av {
  width: 30px; height: 30px; border-radius: 9px;
  display: grid; place-items: center; font-weight: 700; font-size: 12.5px;
  flex: 0 0 auto;
  background: var(--accent-soft); color: var(--accent);
}
.m-name {
  font-size: 12.5px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.m-role { font-size: 9.5px; color: var(--muted); font-weight: 600; }
.m-bal { font-size: 16px; font-weight: 700; }
.m-sub {
  display: flex; justify-content: space-between; gap: 4px;
  font-size: 9.5px; color: var(--muted); font-weight: 500;
  padding-top: 4px; border-top: 1px dashed var(--border);
}

.pos { color: var(--ok) !important; }
.neg { color: var(--danger) !important; }
.neu { color: var(--text-2); }

/* ═══════════════════════════════════════════════════════════════
   8. ATOMS — BADGES, BUTTONS, CHIPS, PROGRESS
   ═══════════════════════════════════════════════════════════════ */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px; border-radius: 99px;
  font-size: 10px; font-weight: 600; white-space: nowrap;
  border: 1px solid transparent; line-height: 1.45;
}
.badge svg { width: 11px; height: 11px; }
.b-ok       { background: var(--ok-soft);       color: var(--ok);       border-color: color-mix(in srgb, var(--ok) 28%, transparent); }
.b-warn     { background: var(--warn-soft);     color: var(--warn);     border-color: color-mix(in srgb, var(--warn) 28%, transparent); }
.b-danger   { background: var(--danger-soft);   color: var(--danger);   border-color: color-mix(in srgb, var(--danger) 28%, transparent); }
.b-info     { background: var(--brand-soft);    color: var(--brand);    border-color: color-mix(in srgb, var(--brand) 28%, transparent); }
.b-uzba     { background: var(--uzba-soft);     color: var(--uzba);     border-color: color-mix(in srgb, var(--uzba) 28%, transparent); }
.b-custody  { background: var(--custody-soft);  color: var(--custody);  border-color: color-mix(in srgb, var(--custody) 28%, transparent); }
.b-treasury { background: var(--treasury-soft); color: var(--treasury); border-color: color-mix(in srgb, var(--treasury) 28%, transparent); }
.b-debts    { background: var(--debts-soft);    color: var(--debts);    border-color: color-mix(in srgb, var(--debts) 28%, transparent); }
.b-mute     { background: var(--surface-3);     color: var(--muted);    border-color: var(--border); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 13px; border-radius: 10px;
  font-size: 12.5px; font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-2); transition: 0.14s; white-space: nowrap;
}
.btn svg { width: 15px; height: 15px; flex: 0 0 auto; }
.btn:hover { color: var(--text); border-color: var(--muted); }
.btn:active { transform: scale(0.97); }
.btn.primary {
  background: var(--accent, var(--brand));
  border-color: var(--accent, var(--brand));
  color: #fff;
}
.btn.primary:hover { filter: brightness(1.08); }
.btn.soft {
  background: var(--accent-soft, var(--brand-soft));
  color: var(--accent, var(--brand));
  border-color: color-mix(in srgb, var(--accent, var(--brand)) 30%, transparent);
}
.btn.ok {
  background: var(--ok-soft); color: var(--ok);
  border-color: color-mix(in srgb, var(--ok) 30%, transparent);
}
.btn.danger {
  background: var(--danger-soft); color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 30%, transparent);
}
.btn.wa {
  background: rgba(37, 211, 102, 0.12); color: #16a34a;
  border-color: rgba(37, 211, 102, 0.35);
}
.btn.sm { padding: 5px 9px; font-size: 11.5px; border-radius: 8px; gap: 4px; }
.btn.sm svg { width: 13px; height: 13px; }
.btn.block { width: 100%; }

.bar { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent, var(--brand)); transition: width 0.35s ease; }

/* ═══════════════════════════════════════════════════════════════
   9. COMPACT TABLES & TRANSACTION LISTS
   ═══════════════════════════════════════════════════════════════ */
.tbl-tools {
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 9px;
}
.tbl-tools input, .tbl-tools select {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 9px; padding: 6px 9px; font-size: 12px; font-weight: 500;
  outline: none; min-width: 0;
}
.tbl-tools input:focus, .tbl-tools select:focus { border-color: var(--accent, var(--brand)); }
.tbl-tools .search { flex: 1 1 140px; }

.tbl-wrap {
  overflow-x: auto; border-radius: var(--r);
  border: 1px solid var(--border-soft);
  -webkit-overflow-scrolling: touch;
}
table th, table td { padding: 8px 10px; text-align: start; font-size: 12px; }
table thead th {
  background: var(--surface-2); font-weight: 600; color: var(--muted);
  font-size: 10.5px; border-bottom: 1px solid var(--border); white-space: nowrap;
}
table tbody tr { border-bottom: 1px solid var(--border-soft); }
table tbody tr:last-child { border-bottom: none; }
table tbody tr:hover { background: var(--surface-2); }
table tfoot td { background: var(--surface-2); font-weight: 700; border-top: 1px solid var(--border); }

.row-acts { display: flex; gap: 4px; justify-content: flex-end; }
.row-acts button {
  width: 26px; height: 26px; border-radius: 7px;
  display: grid; place-items: center;
  color: var(--muted); background: var(--surface-3); transition: 0.14s;
}
.row-acts button svg { width: 12.5px; height: 12.5px; }
.row-acts button:hover { color: var(--text); }
.row-acts button.del:hover { background: var(--danger-soft); color: var(--danger); }

.tag-chip {
  display: inline-block; padding: 1px 5px; border-radius: 5px;
  font-size: 9px; font-weight: 600;
  background: var(--surface-3); color: var(--muted);
  margin-inline-start: 4px;
}

.list { display: flex; flex-direction: column; gap: 6px; }
.list-item {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 11px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--border-soft);
}
.li-ico {
  width: 32px; height: 32px; border-radius: 9px;
  display: grid; place-items: center; flex: 0 0 auto;
  background: var(--accent-soft); color: var(--accent);
}
.li-ico svg { width: 15px; height: 15px; }
.li-main { min-width: 0; flex: 1; }
.li-main b { font-size: 12.5px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-main small { font-size: 10.5px; color: var(--muted); display: block; }
.li-end { margin-inline-start: auto; text-align: end; flex: 0 0 auto; }
.li-end b { font-size: 13px; font-weight: 700; display: block; }
.li-end small { font-size: 9.5px; color: var(--muted); }

.alert {
  display: flex; gap: 9px; align-items: flex-start;
  padding: 10px 12px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-inline-start: 3.5px solid var(--ac, var(--muted));
}
.alert svg { width: 16px; height: 16px; color: var(--ac, var(--muted)); flex: 0 0 auto; margin-top: 2px; }
.alert b { font-size: 12px; font-weight: 700; display: block; }
.alert small { font-size: 10.5px; color: var(--muted); display: block; line-height: 1.45; }
.alert.ok { --ac: var(--ok); }
.alert.warn { --ac: var(--warn); }
.alert.danger { --ac: var(--danger); }
.alert.info { --ac: var(--brand); }

.empty { padding: 20px 12px; text-align: center; color: var(--muted); }
.empty svg { width: 24px; height: 24px; opacity: 0.45; margin-bottom: 4px; }
.empty p { font-size: 12px; font-weight: 500; }

/* ═══════════════════════════════════════════════════════════════
   10. MODALS, FORMS & TOASTS
   ═══════════════════════════════════════════════════════════════ */
.modal {
  position: fixed; inset: 0; z-index: 90;
  display: none; align-items: flex-end; justify-content: center;
}
@media (min-width: 640px) { .modal { align-items: center; padding: 18px; } }
.modal.on { display: flex; }
.modal-bg {
  position: absolute; inset: 0;
  background: rgba(15, 23, 42, 0.52);
  backdrop-filter: blur(3px);
}
.modal-card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  width: 100%; max-width: 500px;
  max-height: 92vh;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.18s cubic-bezier(0.25, 0.9, 0.3, 1);
}
@media (min-width: 640px) { .modal-card { border-radius: var(--r-xl); } }
.modal-card.wide { max-width: 720px; }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

.modal-h {
  display: flex; align-items: center; gap: 9px;
  padding: 13px 15px; border-bottom: 1px solid var(--border-soft); flex: 0 0 auto;
}
.modal-h .mi {
  width: 32px; height: 32px; border-radius: 9px;
  display: grid; place-items: center; flex: 0 0 auto;
  background: var(--accent-soft, var(--brand-soft)); color: var(--accent, var(--brand));
}
.modal-h .mi svg { width: 16px; height: 16px; }
.modal-h h3 { font-size: 14.5px; font-weight: 700; }
.modal-h p { font-size: 10.5px; color: var(--muted); font-weight: 500; }
.modal-h .x {
  margin-inline-start: auto; width: 29px; height: 29px; border-radius: 8px;
  display: grid; place-items: center; color: var(--muted); background: var(--surface-2);
}
.modal-b { padding: 14px 15px; overflow-y: auto; flex: 1 1 auto; }
.modal-f {
  padding: 11px 15px; border-top: 1px solid var(--border-soft);
  display: flex; gap: 7px; flex: 0 0 auto; flex-wrap: wrap;
  padding-bottom: calc(11px + env(safe-area-inset-bottom));
}
.modal-f .btn { flex: 1 1 100px; }

.fgrid { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.fgrid .full { grid-column: 1 / -1; }
@media (max-width: 500px) { .fgrid { grid-template-columns: 1fr; } .fgrid .full { grid-column: auto; } }
.field label { display: block; font-size: 11.5px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
.field label .req { color: var(--danger); }
.field input, .field select, .field textarea {
  width: 100%; background: var(--surface-2); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 8px 11px; font-size: 13.5px; font-weight: 500;
  outline: none; transition: 0.14s;
}
@media (max-width: 640px) { .field input, .field select, .field textarea { font-size: 16px; } }
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent, var(--brand)); background: var(--surface);
}
.field .hint { font-size: 10.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 6px 11px; border-radius: 99px; font-size: 11.5px; font-weight: 600;
  background: var(--surface-2); border: 1.5px solid var(--border); color: var(--muted);
  transition: 0.14s; display: inline-flex; align-items: center; gap: 5px;
}
.chip.on {
  background: var(--accent-soft, var(--brand-soft));
  color: var(--accent, var(--brand));
  border-color: var(--accent, var(--brand));
}

.payer-row {
  display: grid; grid-template-columns: 1fr 125px; gap: 8px;
  align-items: center; padding: 6px 10px;
  background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 10px;
}
.payer-row.active-payer {
  border-color: var(--uzba);
  background: var(--uzba-soft);
}
.payer-row span { font-size: 12.5px; font-weight: 600; }
.payer-row input {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 8px; font-size: 13px; text-align: end; font-weight: 700;
}

.chart-box { position: relative; width: 100%; height: 220px; }

.toast-wrap {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 120;
  display: flex; flex-direction: column; gap: 7px; pointer-events: none;
  width: calc(100% - 28px); max-width: 340px;
}
.toast {
  display: flex; align-items: center; gap: 8px; padding: 9px 13px;
  border-radius: 11px; background: var(--surface); border: 1px solid var(--border);
  box-shadow: var(--shadow-lg); font-size: 12px; font-weight: 600;
}
.toast.s svg { color: var(--ok); }
.toast.e svg { color: var(--danger); }
.toast.i svg { color: var(--brand); }

/* ═══════════════════════════════════════════════════════════════
   11. LOCK SCREEN & SETTINGS TABS
   ═══════════════════════════════════════════════════════════════ */
.lock-screen {
  position: fixed; inset: 0; z-index: 200;
  background: var(--bg);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.lock-screen.on { display: flex; }
.lock-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-xl); padding: 22px 18px; width: 100%; max-width: 360px;
  text-align: center; box-shadow: var(--shadow-lg);
}

.set-nav {
  display: flex; gap: 4px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 11px; padding: 3px;
  margin-bottom: 12px; overflow-x: auto; scrollbar-width: none;
}
.set-nav::-webkit-scrollbar { display: none; }
.set-nav button {
  flex: 1 0 auto; padding: 6px 9px; border-radius: 8px;
  font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap;
}
.set-nav button.on { background: var(--brand); color: #fff; }

.sw-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 11px; background: var(--surface-2);
  border: 1px solid var(--border-soft); border-radius: 10px; margin-bottom: 6px;
}
.sw-row b { font-size: 12px; font-weight: 600; display: block; }
.sw-row small { font-size: 10px; color: var(--muted); display: block; }
.sw {
  width: 40px; height: 22px; border-radius: 99px; flex: 0 0 auto; position: relative;
  background: var(--surface-3); border: 1px solid var(--border); transition: 0.18s;
}
.sw i {
  position: absolute; top: 2px; inset-inline-start: 2px;
  width: 16px; height: 16px; border-radius: 99px;
  background: var(--muted); transition: transform 0.18s ease, background 0.18s;
}
.sw.on { background: var(--ok); border-color: var(--ok); }
.sw.on i { background: #fff; transform: translateX(-18px); }

.sql-box {
  background: #0f172a; color: #a7f3d0; border-radius: 10px;
  padding: 10px; font-family: monospace; font-size: 10px;
  direction: ltr; text-align: left; overflow-x: auto; max-height: 170px;
  margin: 7px 0; white-space: pre;
}

/* ── أيقونة إخفاء الأرقام الذكية داخل كل قسم ── */
.inline-eye-btn {
  width: 28px; height: 28px; border-radius: 8px;
  display: inline-grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--muted); margin-inline-start: 6px;
  vertical-align: middle; transition: 0.14s;
}
.inline-eye-btn:hover { color: var(--text); border-color: var(--accent, var(--brand)); }
.inline-eye-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.inline-eye-btn svg { width: 14.5px; height: 14.5px; }

/* ── صفوف الحقول المتجاوبة والآمنة (تمنع انضغاط الحقول نهائياً على الجوال واللابتوب) ── */
.field {
  min-width: 0;
  width: 100%;
}
.row-3 {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(108px, 0.95fr);
  gap: 10px;
  align-items: end;
}
.row-3 > *, .row-2 > * {
  min-width: 0;
}
@media (max-width: 600px) {
  .row-3 {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
  }
  .row-3 > :first-child {
    grid-column: 1 / -1;
  }
}
.row-2 {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
  align-items: end;
}
@media (max-width: 480px) {
  .row-2.mob-stack, .row-3.mob-stack {
    grid-template-columns: 1fr !important;
  }
}

/* ── حقل التاريخ الذكي المختصر ── */
.smart-date-wrap {
  position: relative;
  min-width: 102px;
}
.smart-date-btn {
  width: 100%;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 8px 9px; border-radius: 10px;
  background: var(--surface-2); border: 1.5px solid var(--border);
  font-size: 12px; font-weight: 700; color: var(--text);
  white-space: nowrap; transition: 0.14s; height: 39px;
}
.smart-date-btn:hover { border-color: var(--accent, var(--brand)); }
.smart-date-btn svg { width: 14px; height: 14px; color: var(--accent, var(--brand)); }
.smart-date-pop {
  position: absolute; top: calc(100% + 5px); inset-inline-end: 0; z-index: 110;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 8px; width: 210px;
  box-shadow: var(--shadow-lg); display: none;
  flex-direction: column; gap: 6px;
}
.smart-date-pop.on { display: flex; }

/* ── قائمة الفرز المنسدلة الذكية ── */
.sort-wrap { position: relative; display: inline-block; }
.sort-pop {
  position: absolute; top: calc(100% + 5px); inset-inline-end: 0; z-index: 80;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 6px; min-width: 215px;
  box-shadow: var(--shadow-lg); display: none; flex-direction: column; gap: 3px;
}
.sort-pop.on { display: flex; }
.sort-opt {
  text-align: start; padding: 7px 10px; border-radius: 8px;
  font-size: 12px; font-weight: 600; color: var(--text-2);
  display: flex; align-items: center; justify-content: space-between;
}
.sort-opt:hover { background: var(--surface-2); color: var(--text); }
.sort-opt.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }

/* ── شريط ملخص تقرير المشرف ── */
.sup-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 12px;
}
@media (max-width: 640px) {
  .sup-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
}


/* ── تحسينات السلاسة الفائقة للجوال وتجربة التطبيق الأصلي (Native App Feel) ── */
html { scroll-behavior: smooth; overscroll-behavior-y: none; }
body { overscroll-behavior-y: none; -webkit-overflow-scrolling: touch; }
button, .tab, .botnav button, .quick-btn, .v-box, .chip, .sort-opt {
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
.topbar { padding-top: env(safe-area-inset-top); }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px;
  overflow: hidden; position: relative;
  background: #1e40af;
  box-shadow: 0 3px 10px rgba(79, 70, 229, 0.24);
  border: 1.5px solid rgba(255, 255, 255, 0.25);
  transition: transform 0.15s ease;
}
.brand-mark:active { transform: scale(0.93); }
.brand-mark img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}

/* ── أيقونة التنبيهات الذكية والعداد التفاعلي ── */
.icon-btn.has-alerts {
  border-color: color-mix(in srgb, var(--warn) 55%, var(--border));
  background: var(--warn-soft);
  color: var(--warn);
}
.icon-btn.has-alerts svg {
  animation: bellSwing 2.2s ease-in-out infinite;
  transform-origin: top center;
}
@keyframes bellSwing {
  0%, 100% { transform: rotate(0deg); }
  10% { transform: rotate(12deg); }
  20% { transform: rotate(-10deg); }
  30% { transform: rotate(6deg); }
  40% { transform: rotate(-4deg); }
  50% { transform: rotate(0deg); }
}
.notif-badge {
  position: absolute; top: -4px; inset-inline-start: -4px;
  min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 99px; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; line-height: 17px;
  text-align: center; box-shadow: 0 0 0 2px var(--surface);
  font-variant-numeric: tabular-nums;
}
.alert.clickable-alert {
  cursor: pointer;
  transition: transform 0.13s ease, opacity 0.18s ease, border-color 0.15s ease, background 0.15s ease;
}
.alert.clickable-alert:hover {
  border-color: var(--ac, var(--brand));
  background: color-mix(in srgb, var(--ac, var(--brand)) 6%, var(--surface-2));
}
.alert.clickable-alert:active { transform: scale(0.985); }

/* ── مستطيل اختيار الفترة المنسدل في أرصدة أعضاء العزبة ── */
.period-rect-btn {
  display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
  min-width: 145px; padding: 6px 11px; border-radius: 10px;
  background: var(--surface-2); border: 1.5px solid var(--border);
  font-size: 12px; font-weight: 700; color: var(--text);
  transition: 0.14s;
}
.period-rect-btn:hover { border-color: var(--uzba); }
.period-rect-btn svg { width: 14px; height: 14px; color: var(--uzba); }

/* ── شبكة اختيار أيقونة النظام في الإعدادات ── */
.icon-picker-grid {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; margin: 8px 0;
}
@media (max-width: 480px) { .icon-picker-grid { grid-template-columns: repeat(3, 1fr); } }
.icon-pick-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 6px; border-radius: 11px;
  background: var(--surface-2); border: 1.5px solid var(--border);
  font-size: 10.5px; font-weight: 600; color: var(--text-2);
}
.icon-pick-item.on {

}

/* ═══════════════════════════════════════════════════════════════
   12. تهيئة التطبيق الأصلي (منع التشوه، تكبير اسم النظام، وتوسيع حقول الجوال)
   ═══════════════════════════════════════════════════════════════ */
*, *::before, *::after {
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none;
}
html, body {
  touch-action: pan-x pan-y;
  -webkit-text-size-adjust: 100%;
  user-select: none;
  -webkit-user-select: none;
}
input, textarea, select, [contenteditable="true"] {
  user-select: text !important;
  -webkit-user-select: text !important;
  -webkit-touch-callout: default;
}
button:focus, a:focus, select:focus, input:focus, textarea:focus {
  outline: none;
}

/* تكبير اسم النظام بعد حذف النص الفرعي ليحل مكانه ومكان النص المحذوف بتوازن وأناقة */
.topbar-in {
  min-height: 56px;
  padding: 9px 14px;
}
.brand {
  display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1 1 auto;
}
.brand-mark {
  width: 40px; height: 40px; border-radius: 12px; flex: 0 0 40px;
}
.brand-txt {
  min-width: 0; flex: 1 1 auto; display: flex; align-items: center;
}
.brand-txt h1 {
  font-size: clamp(17.5px, 4.6vw, 22px);
  font-weight: 700;
  line-height: 1.28;
  letter-spacing: -0.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}
#hdrTitle {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 2px 0;
}
#hdrSub { display: none !important; }

/* توسيع وتنظيم حقول الإدخال والاختيار في جميع النوافذ وضمان ظهور النص بوضوح تام عند الضغط */
.field {
  min-width: 0;
  width: 100%;
}
.field label {
  display: block;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-2);
  margin-bottom: 5px;
}
.field input, .field select, .field textarea {
  display: block;
  width: 100% !important;
  min-width: 0 !important;
  min-height: 45px;
  height: 45px;
  background-color: var(--surface-2) !important;
  color: var(--text) !important;
  -webkit-text-fill-color: var(--text) !important;
  opacity: 1 !important;
  border: 1.5px solid var(--border);
  border-radius: 11px;
  padding: 8px 12px;
  font-size: 14.5px;
  font-weight: 600;
  line-height: 1.35;
  box-sizing: border-box;
}
.field textarea {
  height: auto;
  min-height: 76px;
}
.field input::placeholder, .field textarea::placeholder {
  color: var(--muted) !important;
  -webkit-text-fill-color: var(--muted) !important;
  opacity: 0.75;
  font-weight: 400;
}
.field input:focus, .field select:focus, .field textarea:focus {
  background-color: var(--surface) !important;
  color: var(--text) !important;
  -webkit-text-fill-color: var(--text) !important;
  border-color: var(--accent, var(--brand)) !important;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, var(--brand)) 15%, transparent);
}
@media (max-width: 640px) {
  .field input, .field select, .field textarea {
    font-size: 16px !important;
    min-height: 48px;
    height: 48px;
    padding: 10px 13px;
  }
  .smart-date-btn {
    height: 48px;
    font-size: 13px;
    padding: 9px 11px;
  }
}

/* تخطيط الشبكة الثلاثية والثنائية دون السماح لأي حقل بتقليص الحقول المجاورة */
.row-3 {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(108px, 0.95fr);
  gap: 10px;
  align-items: end;
}
@media (max-width: 600px) {
  .row-3 {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
  }
  .row-3 > :first-child {
    grid-column: 1 / -1;
  }
}
.row-2 {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
  align-items: end;
}
@media (max-width: 480px) {
  .row-2.mob-stack, .row-3.mob-stack {
    grid-template-columns: 1fr !important;
  }
}

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════════════
   §1  الأدوات المساعدة وتنسيق الأرقام والتواريخ
   ═══════════════════════════════════════════════════════════════════════════ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const N = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sum = (arr, f) => (arr || []).reduce((t, x) => t + (f ? N(f(x)) : N(x)), 0);
const CUR = 'ر.س';

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function ico(id, cls) { return '<svg' + (cls ? ' class="' + cls + '"' : '') + '><use href="#' + id + '"/></svg>'; }

function fmt(n, dec) {
  n = N(n);
  if (dec === undefined) dec = Math.abs(n % 1) > 0.004 ? 2 : 0;
  return n.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function mtxt(n, dec) { return fmt(n, dec) + ' ' + CUR; }

function money(n, o) {
  o = o || {};
  const v = N(n);
  const s = (o.sign && v > 0.004 ? '+' : v < -0.004 ? '−' : '') + fmt(Math.abs(v), o.dec);
  return '<span class="num">' + s + '</span>' + (o.cur === false ? '' : '<span class="cur">' + CUR + '</span>');
}

function moneyCore(n, o) {
  if (S && S.ui && S.ui.hideNumbers) {
    return '<span class="num">••••</span>' + ((o && o.cur === false) ? '' : '<span class="cur">' + CUR + '</span>');
  }
  return money(n, o);
}

function todayISO() {
  const d = new Date(), p = x => String(x).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function isoShift(iso, days) {
  const d = new Date((iso || todayISO()) + 'T00:00:00');
  d.setDate(d.getDate() + days);
  const p = x => String(x).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function dLabel(iso) {
  if (!iso) return '—';
  const p = String(iso).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
}
function dShort(iso) {
  if (!iso) return '—';
  const p = String(iso).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] : iso;
}
function daysTo(iso) {
  if (!iso) return null;
  const a = new Date(todayISO() + 'T00:00:00'), b = new Date(iso + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
function simpleHash(str) {
  let h = 2166136261;
  const s = String(str || '');
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16);
}


/** أيقونة إخفاء/إظهار الأرقام الأساسية داخل كل قسم */
function eyeBtn() {
  const hidden = !!(S && S.ui && S.ui.hideNumbers);
  return '<button type="button" class="inline-eye-btn' + (hidden ? ' active' : '') + '" onclick="event.stopPropagation();App.toggleHideNumbers()" title="إخفاء / إظهار الأرقام الأساسية">' +
    ico(hidden ? 'i-eye-off' : 'i-eye') + '</button>';
}

/** تسمية ذكية للتاريخ المختصر */
function smartDateLabel(iso) {
  const t = todayISO();
  if (!iso || iso === t) return 'اليوم ' + dShort(t);
  if (iso === isoShift(t, -1)) return 'أمس ' + dShort(iso);
  if (iso === isoShift(t, 1))  return 'غداً ' + dShort(iso);
  return dShort(iso);
}

/** حقل التاريخ الذكي المختصر (يسجل اليوم تلقائياً وعند الضغط يفتح خيارات سريعة وتقويم) */
function smartDateField(id, val, label) {
  const v = val || todayISO();
  return '<div class="field smart-date-wrap">' +
    '<label>' + esc(label || 'اليوم') + '</label>' +
    '<input type="hidden" id="' + esc(id) + '" value="' + esc(v) + '">' +
    '<button type="button" class="smart-date-btn" id="' + esc(id) + '_btn" onclick="App.toggleSmartDatePop(\'' + esc(id) + '\')">' +
      ico('i-cal') + '<span id="' + esc(id) + '_lbl">' + esc(smartDateLabel(v)) + '</span>' +
    '</button>' +
    '<div class="smart-date-pop" id="' + esc(id) + '_pop">' +
      '<div class="chips" style="justify-content:center">' +
        '<button type="button" class="chip" onclick="App.setSmartDate(\'' + esc(id) + '\',\'' + isoShift(todayISO(), -1) + '\')">أمس</button>' +
        '<button type="button" class="chip on" onclick="App.setSmartDate(\'' + esc(id) + '\',\'' + todayISO() + '\')">اليوم</button>' +
        '<button type="button" class="chip" onclick="App.setSmartDate(\'' + esc(id) + '\',\'' + isoShift(todayISO(), 1) + '\')">غداً</button>' +
      '</div>' +
      '<input type="date" value="' + esc(v) + '" onchange="App.setSmartDate(\'' + esc(id) + '\',this.value)" style="font-size:12px;padding:6px 8px">' +
    '</div>' +
  '</div>';
}

function toast(msg, kind) {
  kind = kind || 's';
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = ico(kind === 's' ? 'i-checkc' : kind === 'e' ? 'i-alert' : 'i-bell') + '<span>' + esc(msg) + '</span>';

}

/* ═══════════════════════════════════════════════════════════════════════════
   §2  مخزن البيانات — IndexedDB مع مرآة LocalStorage
   ═══════════════════════════════════════════════════════════════════════════ */
const APP_BUILD_VERSION = '2026.10.16.v5';
const DB_NAME = 'smartfin_db', DB_VER = 1, DB_STORE = 'state', DB_REC = 'main';
const LS_KEY = 'smartfin.v1', UI_KEY = 'smartfin.ui', SET_KEY = 'smartfin.settings', SYNC_PENDING_KEY = 'smartfin.pending_sync';

const Store = {
  db: null,
  engine: 'ls',
  open() {
    return new Promise(res => {
      let idb = null;
      try { idb = window.indexedDB; } catch (e) { idb = null; }
      if (!idb) return res(null);
      let done = false;
      const finish = v => { if (!done) { done = true; res(v); } };
      const t = setTimeout(() => finish(null), 2500);
      try {
        const req = idb.open(DB_NAME, DB_VER);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        req.onsuccess = e => { clearTimeout(t); finish(e.target.result); };
        req.onerror = () => { clearTimeout(t); finish(null); };
      } catch (e) { clearTimeout(t); finish(null); }
    });
  },
  boot() {
    return this.open().then(db => {
      if (db) { this.db = db; this.engine = 'idb'; }
    });
  },
  read() {
    const lsRead = () => {
      try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; }
      catch (e) { return null; }
    };
    if (this.engine !== 'idb' || !this.db) return Promise.resolve(lsRead());
    return new Promise(res => {
      try {
        const r = this.db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(DB_REC);
        r.onsuccess = () => res(r.result || lsRead());
        r.onerror = () => res(lsRead());
      } catch (e) { res(lsRead()); }
    });
  },
  /* منظومة التخزين المزدوجة: حفظ الإعدادات في LocalStorage وحفظ جميع مدخلات المستخدم أولاً في IndexedDB */
  write(v) {
    try {
      /* 1. حفظ الإعدادات وتفضيلات الواجهة في LocalStorage فوراً */
      localStorage.setItem(UI_KEY, JSON.stringify(v.ui || {}));
      localStorage.setItem(SET_KEY, JSON.stringify({
        user: v.user,
        settings: v.settings
      }));
      localStorage.setItem(SYNC_PENDING_KEY, '1');
    } catch (e) {}

    /* 2. حفظ جميع مدخلات وسجلات المستخدم أولاً في IndexedDB ثم نسخة احتياطية في LocalStorage */
    const saveMirrorLS = () => {
      try { localStorage.setItem(LS_KEY, JSON.stringify(v)); } catch (e) {}
    };

    if (this.engine === 'idb' && this.db) {
      return new Promise(res => {
        try {
          const tx = this.db.transaction(DB_STORE, 'readwrite');
          tx.objectStore(DB_STORE).put(v, DB_REC);
          tx.oncomplete = () => { saveMirrorLS(); res(true); };
          tx.onerror = () => { saveMirrorLS(); res(false); };
        } catch (e) { saveMirrorLS(); res(false); }
      });
    }
    saveMirrorLS();
    return Promise.resolve(true);
  },
  clear() {
    try { localStorage.removeItem(LS_KEY); localStorage.removeItem(UI_KEY); } catch (e) {}
    if (this.engine === 'idb' && this.db) {
      return new Promise(res => {
        try {
          const tx = this.db.transaction(DB_STORE, 'readwrite');
          tx.objectStore(DB_STORE).delete(DB_REC);
          tx.oncomplete = () => res(true);
          tx.onerror = () => res(false);
        } catch (e) { res(false); }
      });
    }
    return Promise.resolve(true);
  }
};

let S = defaultState();
let saveTimer = null;

function save(immediate) {
  clearTimeout(saveTimer);
  const run = () => {
    try {
      const lastAuto = (S.settings.backup && S.settings.backup.lastAutoDate) || '';
      const diff = lastAuto ? daysTo(lastAuto) : -99;
      if (diff !== null && diff <= -7) {
        S.settings.backup.lastAutoDate = todayISO();
        S.settings.backup.autoSnapshot = { date: todayISO(), summary: Eng.grandSummary() };
      }
    } catch (e) {}
    Store.write(S);
    if (S.settings.supabase && S.settings.supabase.url && S.settings.supabase.autoSync && navigator.onLine) {
      UzbaSync.scheduleAutoPush();
    }
  };
  if (immediate) run();
  else saveTimer = setTimeout(run, 120);
}

function commit(msg, kind) {
  save(true);
  App.render();
  if (msg) toast(msg, kind || 's');
}

/* ═══════════════════════════════════════════════════════════════════════════
   §4  محرك الحسابات المالية الذكي (Eng) — فصل مطلق بين الدوائر الثلاث
   ═══════════════════════════════════════════════════════════════════════════ */
const Eng = {

  /* ── 1. حسابات العزبة (الأولوية القصوى) ── */
  activeRoom() {
    const rooms = (S.uzba && S.uzba.rooms) || [];
    return rooms.find(r => r.id === S.uzba.activeRoomId) || rooms[0] || null;
  },

  member(room, id) {
    if (!room) return null;
    return (room.members || []).find(m => m.id === id) || null;
  },

  memberName(room, id) {
    const m = this.member(room, id);
    return m ? m.name : 'عضو';
  },

  /** خزينة العزبة المستقلة (صندوق الكاش الخاص بالعزبة) */
  uzbaVaultBalance(room) {
    room = room || this.activeRoom();
    if (!room) return { in: 0, out: 0, balance: 0 };
    const entries = room.vaultEntries || [];
    const totalIn = sum(entries.filter(e => e.dir === 'in'), e => e.amount);
    const totalOut = sum(entries.filter(e => e.dir === 'out'), e => e.amount);
    /* البنود المدفوعة مباشرة من خزينة العزبة */
    const itemsFromVault = sum((room.items || []).filter(it => it.method === 'uzbaVault'), it => it.total);
    return {
      in: totalIn,
      out: totalOut + itemsFromVault,
      balance: totalIn - totalOut - itemsFromVault
    };
  },

  /** تصفية التاريخ المرنة للعزبة (أمس، اليوم، غداً، هذا الأسبوع، هذا الشهر، فترة مخصصة، الكل) */
  matchUzbaPeriod(dateStr, filterKey) {
    if (!filterKey || filterKey === 'all') return true;
    const t0 = todayISO();
    if (filterKey === 'yesterday') return dateStr === isoShift(t0, -1);
    if (filterKey === 'today')     return dateStr === t0;
    if (filterKey === 'tomorrow')  return dateStr === isoShift(t0, 1);
    if (filterKey === 'week')      return dateStr >= isoShift(t0, -6) && dateStr <= isoShift(t0, 1);
    if (filterKey === 'month')     return String(dateStr || '').slice(0, 7) === t0.slice(0, 7);
    if (filterKey === 'custom') {
      const f = (typeof UzbaAct !== 'undefined' && UzbaAct.customFrom) || '0000-01-01';
      const t = (typeof UzbaAct !== 'undefined' && UzbaAct.customTo)   || '9999-12-31';
      return dateStr >= f && dateStr <= t;
    }
    return true;
  },

  /** حساب أرصدة أعضاء العزبة الفورية + تتبع الرصيد المقدَّم عند شخص */
  uzbaBalances(room, periodKey) {
    room = room || this.activeRoom();
    if (!room) return { members: [], totalSpent: 0, itemCount: 0, activeSpent: 0, activeCount: 0, allSettled: true, advancesStatus: [] };

    const allItems = room.items || [];
    const items = allItems.filter(it => this.matchUzbaPeriod(it.date, periodKey));
    const map = {};
    (room.members || []).forEach(m => {
      map[m.id] = {
        member: m,
        paid: 0,          // ما دفعه في الوجبات والبنود
        share: 0,         // حصته من الوجبات التي شارك فيها
        advanceNet: 0,    // صافي الدفعات المقدمة (موجب للمودع، سالب للمستلم)
        settleNet: 0,     // صافي التسويات المنجزة
        balance: 0,       // الرصيد النهائي الفوري
        mealsCount: 0
      };
    });

    items.forEach(it => {
      const parts = (it.participants || []).filter(pid => map[pid]);
      const share = parts.length > 0 ? N(it.total) / parts.length : 0;
      parts.forEach(pid => {
        map[pid].share += share;
        map[pid].mealsCount += 1;
      });
      if (it.method !== 'uzbaVault') {
        (it.payers || []).forEach(p => {
          if (map[p.memberId]) map[p.memberId].paid += N(p.amount);
        });
      }
    });

    /* احتساب الدفعات المقدمة في دفتر التسوية */
    const advancesStatus = [];
    (room.advances || []).forEach(adv => {
      const amt = N(adv.amount);
      if (map[adv.memberId]) map[adv.memberId].advanceNet += amt;
      if (map[adv.holderId]) map[adv.holderId].advanceNet -= amt;

      /* حساب كم استُهلك من هذه الدفعة المقدمة في الوجبات منذ تاريخ إيداعها */
      let consumed = 0;
      (room.items || []).forEach(it => {
        if (it.date >= adv.date && (it.participants || []).indexOf(adv.memberId) > -1) {
          const cnt = (it.participants || []).length || 1;
          consumed += N(it.total) / cnt;
        }
      });
      const remaining = amt - consumed;
      advancesStatus.push({
        adv,
        memberName: this.memberName(room, adv.memberId),
        holderName: this.memberName(room, adv.holderId),
        initial: amt,
        consumed,
        remaining,
        depleted: remaining <= 0.01,
        low: remaining > 0.01 && remaining <= 40
      });
    });

    /* احتساب التسويات المنجزة */
    (room.settlements || []).forEach(st => {
      const amt = N(st.amount);
      if (map[st.from]) map[st.from].settleNet += amt; // الدافع في التسوية يرتفع رصيده السالب نحو الصفر
      if (map[st.to])   map[st.to].settleNet -= amt;   // المستلم في التسوية ينخفض رصيده الموجب نحو الصفر
    });

    const list = Object.keys(map).map(id => {
      const row = map[id];
      row.balance = (row.paid - row.share) + row.advanceNet + row.settleNet;
      return row;
    });

    /* التحقق مما إذا تم تسديد جميع حصص الأعضاء بالكامل */
    const hasUnsettledBalance = list.some(r => Math.abs(r.balance) > 0.05);
    const unsettledItems = items.filter(it => !it.settledCycle);
    const activeCount = hasUnsettledBalance ? unsettledItems.length : 0;
    const activeSpent = hasUnsettledBalance ? sum(unsettledItems, it => it.total) : 0;

    return {
      members: list,
      totalSpent: activeSpent,
      itemCount: activeCount,
      rawTotalSpent: sum(items, it => it.total),
      rawItemCount: items.length,
      allSettled: !hasUnsettledBalance || activeCount === 0,
      advancesStatus
    };
  },

  /** خوارزمية التسوية الذكية (Greedy Minimum Transfers) */
  uzbaSmartSettlements(room) {
    const stats = this.uzbaBalances(room, 'all');
    const debtors = [];
    const creditors = [];
    stats.members.forEach(r => {
      if (r.balance < -0.05) debtors.push({ id: r.member.id, name: r.member.name, amt: Math.abs(r.balance) });
      else if (r.balance > 0.05) creditors.push({ id: r.member.id, name: r.member.name, amt: r.balance });
    });
    debtors.sort((a, b) => b.amt - a.amt);
    creditors.sort((a, b) => b.amt - a.amt);

    const transfers = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      const d = debtors[i], c = creditors[j];
      const pay = Math.min(d.amt, c.amt);
      if (pay > 0.05) {
        transfers.push({
          fromId: d.id, fromName: d.name,
          toId: c.id, toName: c.name,
          amount: Math.round(pay * 100) / 100
        });
      }
      d.amt -= pay;
      c.amt -= pay;
      if (d.amt <= 0.05) i++;
      if (c.amt <= 0.05) j++;
    }
    return transfers;
  },

  /* ── 2. حسابات أموال الغير / العمال (أمانات منفصلة تماماً) ── */
  custodyFundStats(fund) {
    if (!fund) return null;
    const entries = fund.entries || [];
    const totalIn = sum(entries.filter(e => e.dir === 'in'), e => e.amount);
    const totalOut = sum(entries.filter(e => e.dir === 'out'), e => e.amount);

    /* القروض الجسرية المفتوحة المرتبطة بهذا الصندوق */
    const openLoans = (S.custody.loans || []).filter(l => l.fundId === fund.id && !l.settledAt);
    const loanToFund = sum(openLoans.filter(l => l.dir === 'toFund'), l => l.amount);     // من الشخصي للصندوق
    const loanFromFund = sum(openLoans.filter(l => l.dir === 'fromFund'), l => l.amount); // من الصندوق للشخصي

    const balance = totalIn - totalOut + loanToFund - loanFromFund;

    /* تتبع رصيد كل عامل داخل الصندوق */
    const workerMap = {};
    (fund.workers || []).forEach(w => {
      workerMap[w.name.trim()] = {
        id: w.id, name: w.name.trim(), allocated: N(w.allocated), received: 0, payments: []
      };
    });
    entries.filter(e => e.dir === 'out').forEach(e => {
      const k = (e.party || 'عامل غير محدد').trim();
      if (!workerMap[k]) workerMap[k] = { id: uid(), name: k, allocated: 0, received: 0, payments: [] };
      workerMap[k].received += N(e.amount);
      workerMap[k].payments.push(e);
    });
    const workers = Object.keys(workerMap).map(k => {
      const w = workerMap[k];
      w.remaining = Math.max(0, w.allocated - w.received);
      return w;
    });

    /* كشف تلقائي للعمولة: إذا كان الوارد أكبر من المطلوب للتوزيع */
    const expDist = N(fund.expectedDistribution);
    const commissionDiff = (expDist > 0 && totalIn > expDist && !fund.commissionClaimed)
      ? (totalIn - expDist) : 0;

    const inEntries = entries.filter(e => e.dir === 'in');
    const outEntries = entries.filter(e => e.dir === 'out');
    return {
      fund, totalIn, totalOut, loanToFund, loanFromFund, balance,
      inCount: inEntries.length,
      outCount: outEntries.length,
      totalPaymentsCount: outEntries.length,
      netDiff: totalIn - totalOut,
      workers, commissionDiff,
      isLow: N(fund.lowBalanceLimit) > 0 && balance <= N(fund.lowBalanceLimit)
    };
  },

  custodyAll() {
    const funds = ((S.custody && S.custody.funds) || []).map(f => this.custodyFundStats(f));
    const openLoans = ((S.custody && S.custody.loans) || []).filter(l => !l.settledAt);
    return {
      funds,
      totalIn: sum(funds, f => f.totalIn),
      totalOut: sum(funds, f => f.totalOut),
      balance: sum(funds, f => f.balance),
      openToFund: sum(openLoans.filter(l => l.dir === 'toFund'), l => l.amount),
      openFromFund: sum(openLoans.filter(l => l.dir === 'fromFund'), l => l.amount),
      openLoans
    };
  },

  /* ── 3. حسابات الخزينة الشخصية والحسابات البنكية ── */
  walletBalance(walletId) {
    const P = S.personal;
    let bal = 0;
    if (walletId === 'cash') {
      bal = N(P.cashOpening);
    } else {
      const b = (P.banks || []).find(x => x.id === walletId);
      bal = b ? N(b.opening) : 0;
    }

    /* الإيرادات والمصروفات الشخصية */
    (P.transactions || []).forEach(t => {
      const w = t.walletId || (t.method === 'cash' ? 'cash' : ((P.banks[0] && P.banks[0].id) || 'cash'));
      if (w === walletId) {
        bal += (t.kind === 'in' ? N(t.amount) : -N(t.amount));
      }
    });

    /* التحويلات الداخلية بين النقد والبنوك */
    (P.transfers || []).forEach(tr => {
      if (tr.fromId === walletId) bal -= N(tr.amount);
      if (tr.toId === walletId)   bal += N(tr.amount);
    });

    /* حركات الديون التي أثرت على المحفظة والدفعات الجزئية */
    const debtsOwed = (P.debts && P.debts.owed) || [];
    debtsOwed.forEach(d => {
      if (d.affectWallet && d.walletId === walletId) bal -= N(d.amount);
      (d.payments || []).forEach(p => {
        if ((p.walletId || 'cash') === walletId) bal += N(p.amount);
      });
    });
    const debtsOwing = (P.debts && P.debts.owing) || [];
    debtsOwing.forEach(d => {
      if (d.affectWallet && d.walletId === walletId) bal += N(d.amount);
      (d.payments || []).forEach(p => {
        if ((p.walletId || 'cash') === walletId) bal -= N(p.amount);
      });
    });

    /* القروض الجسرية مع صناديق أموال الغير (عند تفعيل الربط) */
    ((S.custody && S.custody.loans) || []).forEach(l => {
      const w = l.walletId || 'cash';
      if (w === walletId && !l.settledAt) {
        if (l.dir === 'toFund') bal -= N(l.amount);
        if (l.dir === 'fromFund') bal += N(l.amount);
      }
    });

    /* مطابقات كشف الحساب (إن وجدت) */
    (P.reconciliations || []).forEach(r => {
      if (r.walletId === walletId) bal += N(r.diff);
    });

    return bal;
  },

  personalTreasury() {
    const P = S.personal;
    const cash = this.walletBalance('cash');
    const banks = (P.banks || []).map(b => Object.assign({}, b, { balance: this.walletBalance(b.id) }));
    const banksTotal = sum(banks, b => b.balance);
    const totalIn = sum((P.transactions || []).filter(t => t.kind === 'in'), t => t.amount);
    const totalOut = sum((P.transactions || []).filter(t => t.kind === 'out'), t => t.amount);
    return {
      cash,
      banks,
      banksTotal,
      total: cash + banksTotal,
      totalIn,
      totalOut,
      net: totalIn - totalOut
    };
  },

  /* ── 4. حسابات الديون (دَينٌ لك / دَينٌ عليك) ── */
  debtStats(d) {
    const paid = sum(d.payments || [], p => p.amount);
    const remain = Math.max(0, N(d.amount) - paid);
    const days = d.dueDate ? daysTo(d.dueDate) : null;
    let status = 'open', badge = 'b-info', label = 'قائم';
    if (remain <= 0.01) {
      status = 'paid'; badge = 'b-ok'; label = 'مسدَّد بالكامل';
    } else if (days !== null && days < 0) {
      status = 'overdue'; badge = 'b-danger'; label = 'متأخر ' + Math.abs(days) + ' يوم';
    } else if (days === 0) {
      status = 'dueToday'; badge = 'b-danger'; label = 'يستحق اليوم!';
    } else if (days !== null && days <= 3) {
      status = 'dueSoon'; badge = 'b-warn'; label = 'يستحق خلال ' + days + ' أيام';
    } else if (paid > 0.01) {
      status = 'partial'; badge = 'b-warn'; label = 'سُدِّد جزئياً (' + fmt((paid / N(d.amount)) * 100, 0) + '%)';
    }
    return { d, paid, remain, days, status, badge, label };
  },

  debtsSummary() {
    const owed = ((S.personal.debts && S.personal.debts.owed) || []).map(d => this.debtStats(d));
    const owing = ((S.personal.debts && S.personal.debts.owing) || []).map(d => this.debtStats(d));
    return {
      owed,
      owing,
      owedOpen: sum(owed, x => x.remain),
      owingOpen: sum(owing, x => x.remain),
      net: sum(owed, x => x.remain) - sum(owing, x => x.remain)
    };
  },

  /* ── 5. الملخص العام للأرقام الأساسية الأربعة (مع الفصل المطلق) ── */
  grandSummary() {
    const T = this.personalTreasury();
    const U = this.uzbaVaultBalance();
    const C = this.custodyAll();
    const D = this.debtsSummary();
    return {
      /* الرقم الأساسي 1: المجموع الكلي لثروتك الشخصية (نقد + بنوك) */
      totalPersonalWealth: T.total,
      /* الرقم الأساسي 2: مجموع خزينة العزبة المستقلة */
      uzbaVault: U.balance,
      /* الرقم الأساسي 3: مجموع خزينة أموال الغير المستقلة */
      custodyVault: C.balance,
      /* الرقم الأساسي 4: مجموع النقد والبنوك التفصيلي */
      cashBalance: T.cash,
      banksBalance: T.banksTotal,
      debtsOwed: D.owedOpen,
      debtsOwing: D.owingOpen
    };
  },

  /* ── 6. محرك التنبيهات الذكي (داخلي + واتساب) ── */
  alerts() {
    const NTF = (S.settings && S.settings.notifications) || {};
    const out = [];

    /* أ) تنبيهات انتهاء الرصيد المقدم عند شخص في العزبة */
    if (NTF.advanceDepleted !== false) {
      const room = this.activeRoom();
      const uz = this.uzbaBalances(room, 'all');
      uz.advancesStatus.forEach(st => {
        if (st.depleted) {
          out.push({
            level: 'danger',
            section: 'العزبة',
            title: 'انتهى الرصيد المقدَّم للعضو «' + st.memberName + '»',
            desc: 'الدفعة المودعة (' + mtxt(st.initial) + ') عند «' + st.holderName + '» استُهلكت بالكامل (المتبقي ' + mtxt(st.remaining) + ').',
            waText: 'تنبيه من نظام العزبة: يا ' + st.memberName + '، رصيدك المقدم (' + mtxt(st.initial) + ') المودع عند ' + st.holderName + ' قد انتهى بالكامل بعد خصم حصص الوجبات.',
            goTab: 'uzba', goSub: 'settle'
          });
        } else if (st.low) {
          out.push({
            level: 'warn',
            section: 'العزبة',
            title: 'قرب انتهاء الرصيد المقدَّم للعضو «' + st.memberName + '»',
            desc: 'تبقّى ' + mtxt(st.remaining) + ' فقط من أصل ' + mtxt(st.initial) + ' عند «' + st.holderName + '».',
            waText: 'إشعار من العزبة: يا ' + st.memberName + '، تبقّى من رصيدك المقدم عند ' + st.holderName + ' مبلغ ' + mtxt(st.remaining) + ' فقط.',
            goTab: 'uzba', goSub: 'settle'
          });
        }
      });
    }

    /* ب) تنبيهات الديون (قبل 3 أيام، يوم الاستحقاق، متأخر، واقتراب السداد الجزئي) */
    if (NTF.debtDue !== false) {
      const D = this.debtsSummary();
      D.owed.concat(D.owing).forEach(x => {
        if (x.remain <= 0.01) return;
        const isOwed = D.owed.indexOf(x) > -1;
        const kindTxt = isOwed ? 'دَين لك عند ' : 'دَين عليك لـ ';
        if (x.status === 'overdue' || x.status === 'dueToday' || x.status === 'dueSoon') {
          out.push({
            level: x.status === 'dueSoon' ? 'warn' : 'danger',
            section: 'الديون',
            title: kindTxt + '«' + x.d.person + '» — ' + x.label,
            desc: 'المتبقي ' + mtxt(x.remain) + ' من أصل ' + mtxt(x.d.amount) + ' · تاريخ الاستحقاق ' + dLabel(x.d.dueDate),
            phone: x.d.phone || '',
            waText: isOwed
              ? ('السلام عليكم يا ' + x.d.person + '، تذكير ودي بخصوص المبلغ المتبقي (' + mtxt(x.remain) + ') المستحق بتاريخ ' + dLabel(x.d.dueDate) + '.')
              : ('تذكير سداد دَين لـ ' + x.d.person + ' بمبلغ ' + mtxt(x.remain) + ' مستحق بتاريخ ' + dLabel(x.d.dueDate)),
            goTab: 'debts', goSub: isOwed ? 'owed' : 'owing'
          });
        } else if (x.paid > 0 && (x.remain / N(x.d.amount)) <= 0.25) {
          out.push({
            level: 'info',
            section: 'الديون',
            title: 'اقتراب إغلاق دَين «' + x.d.person + '»',
            desc: 'سُدِّد ' + mtxt(x.paid) + ' ولم يتبقَّ سوى ' + mtxt(x.remain) + ' لإغلاق الدين بالكامل.',
            phone: x.d.phone || '',
            waText: 'تحديث رصيد الدين مع ' + x.d.person + ': تم سداد ' + mtxt(x.paid) + ' والمتبقي فقط ' + mtxt(x.remain) + '.',
            goTab: 'debts', goSub: isOwed ? 'owed' : 'owing'
          });
        }
      });
    }

    /* ج) تنبيهات نقص الرصيد في خزينة العزبة أو صناديق أموال الغير */
    if (NTF.lowBalance !== false) {
      const room = this.activeRoom();
      const uv = this.uzbaVaultBalance(room);
      if (room && N(room.lowVaultLimit) > 0 && uv.balance <= N(room.lowVaultLimit)) {
        out.push({
          level: 'warn',
          section: 'العزبة',
          title: 'نقص رصيد خزينة العزبة',
          desc: 'الرصيد النقدي في خزينة العزبة الآن ' + mtxt(uv.balance) + ' (الحد التنبيهي ' + mtxt(room.lowVaultLimit) + ').',
          waText: 'تنبيه لشباب العزبة: رصيد خزينة العزبة وصل إلى ' + mtxt(uv.balance) + ' ويحتاج تغذية.',
          goTab: 'uzba', goSub: 'home'
        });
      }
      this.custodyAll().funds.forEach(fs => {
        if (fs.isLow) {
          out.push({
            level: fs.balance < 0 ? 'danger' : 'warn',
            section: 'أموال الغير',
            title: 'نقص رصيد صندوق «' + fs.fund.name + '»',
            desc: 'المتبقي في الصندوق ' + mtxt(fs.balance) + ' من أمانة «' + fs.fund.source + '».',
            waText: 'إشعار بخصوص صندوق (' + fs.fund.name + '): الرصيد المتبقي حالياً ' + mtxt(fs.balance) + '.',
            goTab: 'custody', goSub: 'funds'
          });
        }
      });
    }

    /* د) تنبيهات أمانات أموال الغير (قرض من الصندوق للشخصي أو عمولة مكتشفة) */
    if (NTF.custodyBridge !== false) {
      const C = this.custodyAll();
      if (C.openFromFund > 0.01) {
        out.push({
          level: 'danger',
          section: 'أموال الغير',
          title: 'مبلغ مسحوب من أمانات الغير لحاجتك الشخصية',
          desc: 'عليك إرجاع ' + mtxt(C.openFromFund) + ' إلى صندوق أموال الغير لإبراء الذمة وفصل الأمانة.',
          waText: 'تذكير شخصي: إرجاع مبلغ ' + mtxt(C.openFromFund) + ' المسحوب مؤقتاً من صندوق أموال الغير.',
          goTab: 'custody', goSub: 'bridge'
        });
      }
      C.funds.forEach(fs => {
        if (fs.commissionDiff > 0.01) {
          out.push({
            level: 'info',
            section: 'أموال الغير',
            title: 'كشف تلقائي للعمولة في «' + fs.fund.name + '»',
            desc: 'المبلغ المستلم يزيد عن المطلوب توزيعه بـ ' + mtxt(fs.commissionDiff) + ' — هل الفرق عمولة لك؟',
            waText: '',
            goTab: 'custody', goSub: 'funds'
          });
        }
      });
    }

    /* هـ) تنبيهات العمليات الكبيرة */
    if (NTF.largeExpense !== false) {
      const lim = N(S.settings.largeExpenseLimit) || 2000;
      (S.personal.transactions || []).filter(t => t.kind === 'out' && N(t.amount) >= lim).slice(0, 2).forEach(t => {
        out.push({
          level: 'warn',
          section: 'الخزينة',
          title: 'عملية مصروف كبيرة (' + mtxt(t.amount) + ')',
          desc: (t.description || t.category) + ' بتاريخ ' + dLabel(t.date) + ' تجاوزت حد ' + mtxt(lim) + '.',
          waText: '',
          goTab: 'treasury', goSub: 'transactions'
        });
      });
    }

    /* و) تذكير النسخة الاحتياطية الأسبوعي */
    if (NTF.weeklyBackup !== false) {
      const last = (S.settings.backup && S.settings.backup.lastManualDate) || '';
      const d = last ? daysTo(last) : -99;
      if (d !== null && d <= -7) {
        out.push({
          level: 'warn',
          section: 'الأمان',
          title: 'تذكير النسخ الاحتياطي الأسبوعي',
          desc: 'مضى ' + Math.abs(d) + ' يوماً على آخر نسخة احتياطية يدوية. احفظ نسخة JSON الآن لضمان أمان بياناتك.',
          waText: '',
          goTab: 'settings', goSub: 'backup'
        });
      }
    }

    const dismissed = (S.settings && Array.isArray(S.settings.dismissedAlerts)) ? S.settings.dismissedAlerts : [];
    const withIds = out.map(a => {
      a.id = 'al_' + simpleHash(a.section + '|' + a.title);
      return a;
    });
    return withIds.filter(a => dismissed.indexOf(a.id) === -1);
  }
};
