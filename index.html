/* ═══════════════════════════════════════════════════════════════════════════
   §6  الشاشة 1: قسم العزبة
   ═══════════════════════════════════════════════════════════════════════════ */
Pages.uzba = function (el) {
  const room = Eng.activeRoom();
  if (!room) {
    el.innerHTML = '<div class="card"><div class="empty">' + ico('i-uzba') +
      '<p>لا توجد غرفة عزبة</p>' +
      '<button class="btn primary" style="margin-top:10px" onclick="Modals.uzbaRoom()">إنشاء غرفة</button></div></div>';
    return;
  }

  const periodFilter = UzbaAct.periodFilter || 'all';
  const B = Eng.uzbaBalances(room, periodFilter);
  const BAll = Eng.uzbaBalances(room, 'all');
  const UV = Eng.uzbaVaultBalance(room);
  const settlements = Eng.uzbaSmartSettlements(room);
  const myName = (S.user && S.user.name || '').trim();

  /* بطاقات أرصدة الأعضاء حسب الفترة المختارة */
  const memberCards = B.members.map(r => {
    const m = r.member;
    const isMe = m.name.trim() === myName;
    const cls = r.balance > 0.05 ? 'pos-card' : r.balance < -0.05 ? 'neg-card' : '';
    const balCls = r.balance > 0.05 ? 'pos' : r.balance < -0.05 ? 'neg' : 'neu';
    const statusTxt = r.balance > 0.05 ? 'له (يستحق)' : r.balance < -0.05 ? 'عليه (يدفع)' : 'متعادل';
    return '<div class="m-card ' + cls + '">' +
      '<div class="m-top">' +
        '<div class="m-av">' + esc(m.name.charAt(0)) + '</div>' +
        '<div style="min-width:0;flex:1">' +
          '<div class="m-name">' + esc(m.name) +
            (isMe ? ' <span class="badge b-uzba">أنت</span>' : '') +
            (!m.isPermanent ? ' <span class="badge b-warn">ضيف</span>' : '') +
          '</div>' +
          '<div class="m-role">' + statusTxt + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="m-bal ' + balCls + '">' + money(r.balance, { sign: true }) + '</div>' +
      '<div class="m-sub">' +
        '<span>دفع: <b>' + fmt(r.paid) + '</b></span>' +
        '<span>حصته: <b>' + fmt(r.share) + '</b></span>' +
      '</div>' +
    '</div>';
  }).join('');

  /* فلترة وفرز سجل البنود الموزّعة (الأحدث أولاً افتراضياً) */
  const q = (UzbaAct.filterQ || '').trim().toLowerCase();
  const fMem = UzbaAct.filterMember || 'all';
  const sortMode = UzbaAct.sortMode || 'newest';

  const indexedItems = (room.items || []).map((it, idx) => ({ it, idx }));
  const filtered = indexedItems.filter(({ it }) => {
    if (!Eng.matchUzbaPeriod(it.date, periodFilter)) return false;
    if (fMem !== 'all') {
      const paidBy = (it.payers || []).some(p => p.memberId === fMem);
      const partIn = (it.participants || []).indexOf(fMem) > -1;
      if (!paidBy && !partIn) return false;
    }
    if (q) {
      const hay = (it.description + ' ' + (it.category || '')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    if (sortMode === 'oldest') {
      return a.it.date.localeCompare(b.it.date) || (a.idx - b.idx);
    }
    if (sortMode === 'date') {
      return b.it.date.localeCompare(a.it.date) || (b.idx - a.idx);
    }
    if (sortMode === 'amtDesc') {
      return (N(b.it.total) - N(a.it.total)) || (b.idx - a.idx);
    }
    if (sortMode === 'amtAsc') {
      return (N(a.it.total) - N(b.it.total)) || (b.idx - a.idx);
    }
    /* newest (الأحدث أولاً في الأعلى إلى الأقدم في الأسفل) */
    return b.it.date.localeCompare(a.it.date) || (b.idx - a.idx);
  });

  const rows = filtered.map(x => x.it);

  const waSettleText = settlements.length
    ? ('*تسوية العزبة (' + room.name + ')*:\n' +
       settlements.map(t => '• يدفع *' + t.fromName + '* إلى *' + t.toName + '*: *' + mtxt(t.amount) + '*').join('\n'))
    : 'حساب العزبة متعادل للجميع!';

  const periodOptions = [
    { k: 'today',     t: 'اليوم' },
    { k: 'week',      t: 'هذا الأسبوع' },
    { k: 'month',     t: 'هذا الشهر' },
    { k: 'yesterday', t: 'أمس' },
    { k: 'tomorrow',  t: 'غداً' },
    { k: 'all',       t: 'كل الفترات' },
    { k: 'custom',    t: 'فترة مخصصة' }
  ];

  el.innerHTML = '<div class="stack">' +

    /* 1. ملخص العزبة (مع إخفاء عداد المبلغ وعداد الوجبات الموزعة وتصفيرها فور تسديد الجميع لحصصهم) */
    '<div class="pghero">' +
      '<div>' +
        '<div class="ph-cap">' + ico('i-uzba') + '<span>' + esc(room.name) + ' · رمز: <b class="num">' + esc(room.code) + '</b></span>' + eyeBtn() + '</div>' +
        (!B.allSettled && B.itemCount > 0
          ? '<div class="ph-big">' + moneyCore(B.totalSpent) + '</div>'
          : '') +
        '<div class="ph-chips">' +
          (!B.allSettled && B.itemCount > 0
            ? '<span class="badge b-uzba">' + B.itemCount + ' وجبة موزّعة</span>'
            : '<span class="badge b-ok">' + ico('i-checkc') + 'تم تسديد جميع الحصص</span>') +
          '<span class="badge b-ok">صندوق العزبة: ' + moneyCore(UV.balance) + '</span>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:7px">' +
        '<button class="btn primary block" style="padding:11px;font-size:13.5px" onclick="Modals.uzbaQuickMeal()">' +
          ico('i-plus') + 'تسجيل وجبة / دفعة جديدة' +
        '</button>' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">' +
          '<button class="btn soft sm" onclick="Modals.uzbaAdvance()">' + ico('i-clock') + 'رصيد مقدَّم</button>' +
          '<button class="btn sm" onclick="Modals.uzbaMembersManage()">' + ico('i-users') + 'الأعضاء (' + (room.members || []).length + ')</button>' +
          '<button class="btn sm" onclick="Modals.uzbaVaultEntry()">' + ico('i-wallet') + 'الصندوق</button>' +
        '</div>' +
      '</div>' +
    '</div>' +

    /* 2. دفتر تسجيل الوجبات اليومي والمستمر */
    renderStagedMealsWidget(room) +

    /* 3. أرصدة الأعضاء (عرض المستطيل الحالي فقط وعند الضغط عليه تفتح قائمة منسدلة منظمة) */
    '<div class="card">' +
      '<div class="card-h">' +
        '<h3>' + ico('i-users') + 'أرصدة الأعضاء</h3>' +
        '<div class="right">' +
          '<div class="sort-wrap" id="uzbaPeriodWrap">' +
            '<button type="button" class="period-rect-btn" onclick="App.togglePeriodPop()">' +
              '<span>' + esc((periodOptions.find(o => o.k === periodFilter) || periodOptions[0]).t) + '</span>' +
              ico('i-chev') +
            '</button>' +
            '<div class="sort-pop" id="uzba_period_pop">' +
              periodOptions.map(o =>
                '<button type="button" class="sort-opt ' + (periodFilter === o.k ? 'on' : '') + '" onclick="UzbaAct.setPeriodFilter(\'' + o.k + '\')">' +
                  '<span>' + esc(o.t) + '</span>' + (periodFilter === o.k ? ico('i-check') : '') +
                '</button>'
              ).join('') +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      (periodFilter === 'custom' ? (
        '<div class="row-2" style="margin-bottom:10px">' +
          '<div class="field"><label>من تاريخ</label><input type="date" value="' + esc(UzbaAct.customFrom || isoShift(todayISO(), -7)) + '" onchange="UzbaAct.customFrom=this.value;App.render()"></div>' +
          '<div class="field"><label>إلى تاريخ</label><input type="date" value="' + esc(UzbaAct.customTo || todayISO()) + '" onchange="UzbaAct.customTo=this.value;App.render()"></div>' +
        '</div>'
      ) : '') +
      '<div class="m-grid">' + memberCards + '</div>' +
    '</div>' +

    /* 4. التسوية الذكية والرصيد المقدَّم */
    '<div class="split even">' +
      '<div class="card">' +
        '<div class="card-h">' +
          '<h3>' + ico('i-bridge') + 'التسوية الذكية</h3>' +
          '<div class="right">' +
            (settlements.length ? '<button class="btn sm wa" onclick="App.sendWhatsApp(\'\',' + JSON.stringify(waSettleText) + ')">' + ico('i-wa') + 'واتساب</button>' : '') +
          '</div>' +
        '</div>' +
        (settlements.length ? '<div class="list">' + settlements.map(s =>
          '<div class="list-item">' +
            '<div class="li-main"><b>' + esc(s.fromName) + ' ← ' + esc(s.toName) + '</b></div>' +
            '<div class="li-end" style="display:flex;align-items:center;gap:6px">' +
              '<b class="pos">' + money(s.amount) + '</b>' +
              '<button class="btn primary sm" onclick="UzbaAct.confirmSettlement(\'' + s.fromId + '\',\'' + s.toId + '\',' + s.amount + ')">' + ico('i-check') + 'أُنجزت</button>' +
            '</div>' +
          '</div>'
        ).join('') + '</div>' : '<div class="alert ok">' + ico('i-checkc') + '<div><b>جميع الحصص مسددة والأرصدة متعادلة!</b></div></div>') +
      '</div>' +

      '<div class="card">' +
        '<div class="card-h">' +
          '<h3>' + ico('i-clock') + 'الرصيد المقدَّم عند شخص</h3>' +
          '<div class="right"><button class="btn sm soft" onclick="Modals.uzbaAdvance()">' + ico('i-plus') + 'إضافة</button></div>' +
        '</div>' +
        (BAll.advancesStatus.length ? '<div class="list">' + BAll.advancesStatus.map(st => {
          const pctUsed = st.initial > 0 ? clamp((st.consumed / st.initial) * 100, 0, 100) : 100;
          const barCol = st.depleted ? 'var(--danger)' : st.low ? 'var(--warn)' : 'var(--ok)';
          return '<div class="list-item" style="flex-direction:column;align-items:stretch;gap:5px">' +
            '<div style="display:flex;justify-content:space-between;align-items:center">' +
              '<b>' + esc(st.memberName) + ' عند ' + esc(st.holderName) + '</b>' +
              '<div style="display:flex;align-items:center;gap:5px">' +
                '<span class="badge ' + (st.depleted ? 'b-danger' : st.low ? 'b-warn' : 'b-ok') + '">' +
                  (st.depleted ? 'نفد' : 'متبقي ' + mtxt(st.remaining)) +
                '</span>' +
                '<button class="btn sm danger" style="padding:3px 6px" onclick="UzbaAct.deleteAdvance(\'' + st.adv.id + '\')">' + ico('i-trash') + '</button>' +
              '</div>' +
            '</div>' +
            '<div class="bar"><i style="width:' + pctUsed.toFixed(1) + '%;background:' + barCol + '"></i></div>' +
            '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted)">' +
              '<span>أودع: ' + fmt(st.initial) + '</span>' +
              '<span>خُصم: ' + fmt(st.consumed) + '</span>' +
            '</div>' +
          '</div>';
        }).join('') + '</div>' : '<div class="empty"><p>لا يوجد رصيد مقدَّم</p></div>') +
      '</div>' +
    '</div>' +

    /* 5. سجل الوجبات والبنود الموزّعة (مع الفرز الذكي: الأحدث أولاً في الأعلى) */
    '<div class="card">' +
      '<div class="card-h">' +
        '<h3>' + ico('i-layers') + 'سجل الوجبات الموزّعة</h3>' +
        '<div class="right">' +
          sortMenuHTML('uzba', sortMode) +
          '<button class="btn primary sm" onclick="Modals.uzbaQuickMeal()">' + ico('i-plus') + 'وجبة</button>' +
        '</div>' +
      '</div>' +
      '<div class="tbl-tools">' +
        '<input type="search" class="search" placeholder="بحث في الوجبات…" value="' + esc(UzbaAct.filterQ || '') + '" oninput="UzbaAct.filterQ=this.value;App.render()">' +
        '<select onchange="UzbaAct.filterMember=this.value;App.render()">' +
          '<option value="all">كل الأعضاء</option>' +
          (room.members || []).map(m => '<option value="' + esc(m.id) + '"' + (fMem === m.id ? ' selected' : '') + '>' + esc(m.name) + '</option>').join('') +
        '</select>' +
      '</div>' +
      (rows.length ? '<div class="tbl-wrap"><table><thead><tr>' +
        '<th>التاريخ</th><th>الوجبة ومن دفع</th><th>المبلغ</th><th style="width:68px"></th>' +
      '</tr></thead><tbody>' + rows.map(it => {
        const payersTxt = it.method === 'uzbaVault'
          ? 'صندوق العزبة'
          : (it.payers || []).map(p => Eng.memberName(room, p.memberId) + ' (' + fmt(p.amount) + ')').join(' + ');
        const partCnt = (it.participants || []).length;
        const share = partCnt ? (N(it.total) / partCnt) : 0;
        return '<tr>' +
          '<td style="white-space:nowrap">' + dShort(it.date) + '</td>' +
          '<td><b>' + esc(it.description) + '</b>' +
            (it.settledCycle ? ' <span class="badge b-ok">مسدَّدة</span>' : '') +
            '<br><small style="color:var(--muted)">دفع: <b>' + esc(payersTxt) + '</b> · شارك ' + partCnt + ' (' + fmt(share, 1) + ' للفرد)</small></td>' +
          '<td><b>' + money(it.total) + '</b></td>' +
          '<td><div class="row-acts">' +
            '<button onclick="Modals.uzbaQuickMeal(\'\',\'' + it.id + '\')" title="تعديل">' + ico('i-edit') + '</button>' +
            '<button class="del" onclick="UzbaAct.deleteItem(\'' + it.id + '\')" title="حذف">' + ico('i-trash') + '</button>' +
          '</div></td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>' : '<div class="empty"><p>لا توجد وجبات موزّعة</p></div>') +
    '</div>' +

  '</div>';
};

/* ═══════════════════════════════════════════════════════════════════════════
   §7  إجراءات قسم العزبة الذكية (UzbaAct)
   ═══════════════════════════════════════════════════════════════════════════ */
const UzbaAct = {
  filterQ: '', filterMember: 'all', filterCat: 'all',
  periodFilter: 'all',
  sortMode: 'newest',
  customFrom: isoShift(todayISO(), -7),
  customTo: todayISO(),
  _payerMode: 'me',
  _otherPayerId: '',

  setPeriodFilter(val) {
    this.periodFilter = val || 'all';
    App.render();
  },

  deleteStaged(id) {
    const room = Eng.activeRoom();
    if (!room) return;
    room.stagedMeals = (room.stagedMeals || []).filter(m => m.id !== id);
    commit('تم الحذف من الدفتر');
  },

  deleteItem(id) {
    const room = Eng.activeRoom();
    if (!room) return;
    Modals.confirm('حذف هذه الوجبة وتحديث الأرصدة؟', () => {
      room.items = (room.items || []).filter(x => x.id !== id);
      commit('تم حذف الوجبة');
    });
  },

  confirmSettlement(fromId, toId, amount) {
    const room = Eng.activeRoom();
    if (!room) return;
    const fromName = Eng.memberName(room, fromId);
    const toName = Eng.memberName(room, toId);
    Modals.confirm('تأكيد سداد ' + mtxt(amount) + ' من «' + fromName + '» إلى «' + toName + '»؟', () => {
      (room.settlements || (room.settlements = [])).push({
        id: 'st_' + uid(),
        date: todayISO(),
        from: fromId,
        to: toId,
        amount: N(amount),
        note: 'تسوية'
      });
      /* إذا أصبحت أرصدة جميع الأعضاء صفراً بعد التسديد، تُعتبر الوجبات السابقة مسددة وتصفر العدادات */
      const afterStats = Eng.uzbaBalances(room, 'all');
      if (afterStats.members.every(r => Math.abs(r.balance) <= 0.05)) {
        (room.items || []).forEach(it => { it.settledCycle = true; });
      }
      commit('تمت التسوية وتحديث الأرصدة');
    }, 'تأكيد التسوية');
  },

  deleteSettlement(id) {
    const room = Eng.activeRoom();
    if (!room) return;
    Modals.confirm('حذف هذه التسوية؟', () => {
      room.settlements = (room.settlements || []).filter(s => s.id !== id);
      commit('تم الحذف');
    });
  },

  deleteAdvance(id) {
    const room = Eng.activeRoom();
    if (!room) return;
    Modals.confirm('حذف الرصيد المقدَّم؟', () => {
      room.advances = (room.advances || []).filter(a => a.id !== id);
      commit('تم الحذف');
    });
  },

  toggleMemberActive(id) {
    const room = Eng.activeRoom();
    if (!room) return;
    const m = Eng.member(room, id);
    if (!m) return;
    m.active = !m.active;
    commit(m.active ? 'تم تفعيل العضو' : 'تم إيقاف العضو مؤقتاً', 'i');
    if ($('#modal').classList.contains('on')) Modals.uzbaMembersManage();
  },

  deleteMember(id) {
    const room = Eng.activeRoom();
    if (!room) return;
    const used = (room.items || []).some(it =>
      (it.participants || []).indexOf(id) > -1 || (it.payers || []).some(p => p.memberId === id)
    );
    if (used) {
      toast('العضو مسجل في وجبات سابقة — يمكنك إيقافه مؤقتاً', 'e');
      return;
    }
    Modals.confirm('حذف العضو من العزبة؟', () => {
      room.members = (room.members || []).filter(m => m.id !== id);
      commit('تم حذف العضو');
      if ($('#modal').classList.contains('on')) Modals.uzbaMembersManage();
    });
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   §8  الشاشة 2: قسم أموال الغير / العمال 💼
   ═══════════════════════════════════════════════════════════════════════════ */
Pages.custody = function (el) {
  const C = Eng.custodyAll();
  const sub = (S.ui.sub && S.ui.sub.custody) || 'funds';
  const activeFundId = Pages._activeFundId || (S.custody.funds[0] && S.custody.funds[0].id) || '';
  const curStats = C.funds.find(f => f.fund.id === activeFundId) || C.funds[0] || null;
  if (curStats) Pages._activeFundId = curStats.fund.id;

  const subTabs = [
    { k: 'funds',   t: 'الصناديق والحركات', i: 'i-custody', n: C.funds.length },
    { k: 'workers', t: 'العمال',            i: 'i-users',   n: curStats ? curStats.workers.length : 0 },
    { k: 'bridge',  t: 'السحب والإقراض',    i: 'i-bridge',  n: C.openLoans.length },
    { k: 'report',  t: 'تقرير المشرف',       i: 'i-debts' }
  ];

  const navHTML = '<div class="subnav"><div class="sn-track">' + subTabs.map(t =>
    '<button class="' + (sub === t.k ? 'on' : '') + '" onclick="App.setSub(\'custody\',\'' + t.k + '\')">' +
    ico(t.i) + '<span>' + esc(t.t) + '</span>' +
    (t.n ? '<em>' + t.n + '</em>' : '') + '</button>'
  ).join('') + '</div></div>';

  if (!curStats) {
    el.innerHTML = navHTML + '<div class="card"><div class="empty">' + ico('i-custody') +
      '<p>لا توجد صناديق أمانات</p>' +
      '<button class="btn primary" style="margin-top:10px" onclick="Modals.custodyFund()">' + ico('i-plus') + 'فتح صندوق جديد</button></div></div>';
    return;
  }

  const fd = curStats.fund;

  const fundSelector = '<div class="card" style="padding:10px 12px">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">' +
      '<div style="display:flex;align-items:center;gap:7px;flex:1;min-width:190px">' +
        ico('i-custody') +
        '<select style="flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:6px 9px;font-weight:700" onchange="Pages._activeFundId=this.value;App.render()">' +
          C.funds.map(fs => '<option value="' + esc(fs.fund.id) + '"' + (fs.fund.id === fd.id ? ' selected' : '') + '>' + esc(fs.fund.name) + ' · ' + mtxt(fs.balance) + '</option>').join('') +
        '</select>' +
      '</div>' +
      '<div style="display:flex;gap:5px;flex-wrap:wrap">' +
        '<button class="btn sm primary" onclick="Modals.custodyEntry(\'' + fd.id + '\',\'in\')">' + ico('i-plus') + 'وارد</button>' +
        '<button class="btn sm soft" onclick="Modals.custodyEntry(\'' + fd.id + '\',\'out\')">' + ico('i-cash') + 'صرف لعامل</button>' +
        '<button class="btn sm" onclick="Modals.custodyFund()">' + ico('i-plus') + 'صندوق</button>' +
      '</div>' +
    '</div>' +
  '</div>';

  if (sub === 'funds') {
    const commAlert = curStats.commissionDiff > 0.01 ? (
      '<div class="alert info">' + ico('i-bell') +
        '<div style="flex:1">' +
          '<b>فرق زائد ' + money(curStats.commissionDiff) + ' — هل هو عمولة لك؟</b>' +
          '<small>الوارد (' + mtxt(curStats.totalIn) + ') أكبر من المطلوب توزيعه (' + mtxt(fd.expectedDistribution) + ')</small>' +
        '</div>' +
        '<button class="btn sm primary" onclick="CustodyAct.claimCommission(\'' + fd.id + '\',' + curStats.commissionDiff + ')">تحويل لعمولتي</button>' +
      '</div>'
    ) : '';

    /* فرز حركات الصندوق (الأحدث أولاً في الأعلى افتراضياً) */
    const sortMode = CustodyAct.sortMode || 'newest';
    const indexedEntries = (fd.entries || []).map((e, idx) => ({ e, idx }));
    indexedEntries.sort((a, b) => {
      if (sortMode === 'oldest')  return a.e.date.localeCompare(b.e.date) || (a.idx - b.idx);
      if (sortMode === 'date')    return b.e.date.localeCompare(a.e.date) || (b.idx - a.idx);
      if (sortMode === 'amtDesc') return (N(b.e.amount) - N(a.e.amount)) || (b.idx - a.idx);
      if (sortMode === 'amtAsc')  return (N(a.e.amount) - N(b.e.amount)) || (b.idx - a.idx);
      return b.e.date.localeCompare(a.e.date) || (b.idx - a.idx);
    });
    const entries = indexedEntries.map(x => x.e);

    el.innerHTML = navHTML + '<div class="stack">' +
      fundSelector +
      '<div class="pghero">' +
        '<div>' +
          '<div class="ph-cap">' + ico('i-custody') + '<span>' + esc(fd.name) + ' · ' + esc(fd.source) + '</span>' + eyeBtn() + '</div>' +
          '<div class="ph-big ' + (curStats.balance < 0 ? 'neg' : '') + '">' + moneyCore(curStats.balance) + '</div>' +
          '<div class="ph-chips">' +
            '<span class="badge b-custody">أمانة مستقلة</span>' +
            (S.custody.linkToPersonal ? '<span class="badge b-ok">الربط الجسري: مفعّل</span>' : '<span class="badge b-mute">منفصل تماماً</span>') +
          '</div>' +
        '</div>' +
        '<div class="ph-kpis">' +
          '<div class="tile"><span>الوارد (' + curStats.inCount + ')</span><b class="pos">' + money(curStats.totalIn) + '</b></div>' +
          '<div class="tile"><span>الموزَّع (' + curStats.outCount + ')</span><b class="neg">' + money(curStats.totalOut) + '</b></div>' +
          '<div class="tile"><span>العمال</span><b>' + curStats.workers.length + '</b></div>' +
        '</div>' +
      '</div>' +
      commAlert +
      '<div class="card">' +
        '<div class="card-h">' +
          '<h3>' + ico('i-layers') + 'حركات الصندوق</h3>' +
          '<div class="right">' +
            sortMenuHTML('custody', sortMode) +
            '<button class="btn sm" onclick="Modals.custodyFund(\'' + fd.id + '\')">' + ico('i-edit') + 'تعديل</button>' +
          '</div>' +
        '</div>' +
        (entries.length ? '<div class="tbl-wrap"><table><thead><tr>' +
          '<th>التاريخ</th><th>الجهة والغرض</th><th>المبلغ</th><th style="width:60px"></th>' +
        '</tr></thead><tbody>' + entries.map(e =>
          '<tr>' +
            '<td style="white-space:nowrap">' + dShort(e.date) + '</td>' +
            '<td>' +
              '<span class="badge ' + (e.dir === 'in' ? 'b-ok' : 'b-custody') + '">' + (e.dir === 'in' ? 'وارد' : 'صادر') + '</span> ' +
              '<b>' + esc(e.party || '—') + '</b>' + (e.purpose ? ' · ' + esc(e.purpose) : '') +
            '</td>' +
            '<td><b class="' + (e.dir === 'in' ? 'pos' : 'neg') + '">' + money(e.dir === 'in' ? e.amount : -e.amount, { sign: true }) + '</b></td>' +
            '<td><div class="row-acts">' +
              '<button class="del" onclick="CustodyAct.deleteEntry(\'' + fd.id + '\',\'' + e.id + '\')" title="حذف">' + ico('i-trash') + '</button>' +
            '</div></td>' +
          '</tr>'
        ).join('') + '</tbody></table></div>' : '<div class="empty"><p>لا حركات مسجلة</p></div>') +
      '</div>' +
    '</div>';
    return;
  }

  if (sub === 'workers') {
    el.innerHTML = navHTML + '<div class="stack">' +
      fundSelector +
      '<div class="card">' +
        '<div class="card-h">' +
          '<h3>' + ico('i-users') + 'أرصدة العمال</h3>' +
          '<div class="right"><button class="btn primary sm" onclick="Modals.custodyWorker(\'' + fd.id + '\')">' + ico('i-plus') + 'إضافة عامل</button></div>' +
        '</div>' +
        (curStats.workers.length ? '<div class="grid g3">' + curStats.workers.map(w => {
          const pctPaid = w.allocated > 0 ? clamp((w.received / w.allocated) * 100, 0, 100) : 100;
          return '<div class="m-card">' +
            '<div class="m-top">' +
              '<div class="m-av">' + esc(w.name.charAt(0)) + '</div>' +
              '<div style="min-width:0;flex:1">' +
                '<div class="m-name">' + esc(w.name) + '</div>' +
                '<div class="m-role">' + w.payments.length + ' دفعة</div>' +
              '</div>' +
              '<button class="btn sm primary" onclick="Modals.custodyEntry(\'' + fd.id + '\',\'out\',\'' + esc(w.name) + '\',' + w.remaining + ')">صرف</button>' +
            '</div>' +
            '<div class="bar" style="margin:5px 0"><i style="width:' + pctPaid.toFixed(1) + '%"></i></div>' +
            '<div class="m-sub">' +
              '<span class="pos">المستلم: <b>' + fmt(w.received) + '</b></span>' +
              '<span class="' + (w.remaining > 0 ? 'neg' : '') + '">المتبقي: <b>' + fmt(w.remaining) + '</b></span>' +
            '</div>' +
          '</div>';
        }).join('') + '</div>' : '<div class="empty"><p>لا عمال مسجلين</p></div>') +
      '</div>' +
    '</div>';
    return;
  }

  if (sub === 'bridge') {
    const linked = !!S.custody.linkToPersonal;
    el.innerHTML = navHTML + '<div class="stack">' +
      fundSelector +
      '<div class="card">' +
        '<div class="card-h">' +
          '<h3>' + ico('i-bridge') + 'السحب والإقراض مع حسابي الشخصي</h3>' +
          '<div class="right">' +
            '<button class="btn sm ' + (linked ? 'ok' : '') + '" onclick="CustodyAct.togglePersonalLink()">' +
              (linked ? 'الربط: مفعّل ✓' : 'الربط: مفصول') +
            '</button>' +
          '</div>' +
        '</div>' +
        (linked ? (
          '<div class="grid g3" style="margin-bottom:12px">' +
            '<button class="m-card" style="text-align:start;cursor:pointer" onclick="Modals.custodyBridgeLoan(\'' + fd.id + '\',\'toFund\')">' +

              '<b>سلفة من مالي للصندوق</b>' +
            '</button>' +
            '<button class="m-card" style="text-align:start;cursor:pointer" onclick="Modals.custodyBridgeLoan(\'' + fd.id + '\',\'fromFund\')">' +
              '<div class="ph-cap" style="color:var(--warn)">' + ico('i-alert') + 'سحب مؤقت لحاجتي</div>' +
              '<b>قرض من الصندوق لي</b>' +
            '</button>' +
            '<button class="m-card" style="text-align:start;cursor:pointer" onclick="Modals.custodyCommission(\'' + fd.id + '\')">' +
              '<div class="ph-cap" style="color:var(--ok)">' + ico('i-checkc') + 'عمولة توزيع</div>' +
              '<b>تحويل عمولة لحسابي</b>' +
            '</button>' +
          '</div>'
        ) : '<div class="alert warn" style="margin-bottom:10px">' + ico('i-lock') + '<div><b>الفصل التام مفعّل</b><small>فعّل الربط من الزر أعلاه للسماح بتغطية العجز أو القروض المؤقتة.</small></div></div>') +

        ((S.custody.loans || []).length ? '<div class="list">' + S.custody.loans.slice().reverse().map(l => {
          const fObj = (S.custody.funds || []).find(x => x.id === l.fundId);
          return '<div class="list-item">' +
            '<div class="li-main">' +
              '<b>' + (l.dir === 'toFund' ? 'سلفة للصندوق (' + esc(fObj ? fObj.name : '') + ')' : 'قرض لي من الصندوق (' + esc(fObj ? fObj.name : '') + ')') + '</b>' +
              '<small>' + dShort(l.date) + (l.note ? ' · ' + esc(l.note) : '') + '</small>' +
            '</div>' +
            '<div class="li-end" style="display:flex;align-items:center;gap:6px">' +
              '<b>' + money(l.amount) + '</b>' +
              (l.settledAt ? '<span class="badge b-ok">مسدَّد</span>' : '<button class="btn sm primary" onclick="CustodyAct.settleLoan(\'' + l.id + '\')">سداد</button>') +
            '</div>' +
          '</div>';
        }).join('') + '</div>' : '<div class="empty"><p>لا قروض جسرية</p></div>') +
      '</div>' +
    '</div>';
    return;
  }

  /* ── 4. تقرير المشرف (4 أعمدة فقط بدون المخصص + شريط الملخص الرباعي + تصدير صورة عالية الدقة) ── */
  if (sub === 'report') {
    const diffVal = curStats.netDiff;
    const diffStatusTxt = diffVal > 0.01
      ? 'أُنفق أقل مما استُلم (متبقي فائض)'
      : diffVal < -0.01
        ? 'دُفع أكثر مما استُلم (عجز)'
        : 'متطابق (أُنفق كامل المستلم)';

    const repLines = [
      '📋 *تقرير تسليم العمال — ' + fd.name + '*',
      'المصدر: ' + fd.source + ' | التاريخ: ' + dLabel(todayISO()),
      '• عدد الدفعات: ' + curStats.totalPaymentsCount,
      '• المبالغ المحولة (' + curStats.inCount + '): ' + mtxt(curStats.totalIn),
      '• المبالغ المنفقة (' + curStats.outCount + '): ' + mtxt(curStats.totalOut),
      '• الفارق: ' + mtxt(diffVal) + ' (' + diffStatusTxt + ')',
      '──────────────────'
    ].concat(curStats.workers.map(w =>
      '• ' + w.name + ': المستلم *' + mtxt(w.received) + '* | المتبقي: ' + mtxt(w.remaining) + ' | الدفعات: ' + w.payments.length
    ));
    const repText = repLines.join('\n');

    el.innerHTML = navHTML + '<div class="stack">' +
      fundSelector +
      '<div class="card" id="supReportCard">' +
        '<div class="card-h">' +
          '<h3>' + ico('i-debts') + 'تقرير المشرف — ' + esc(fd.name) + '</h3>' +
          '<span class="sub">' + esc(fd.source) + ' · ' + dLabel(todayISO()) + '</span>' +
          '<div class="right">' +
            '<button class="btn primary sm" onclick="CustodyAct.exportSupervisorImage(\'' + fd.id + '\')">' + ico('i-img') + 'تصدير صورة عالية الدقة</button>' +
            '<button class="btn sm" onclick="App.copyText(' + JSON.stringify(repText) + ',\'تم نسخ التقرير\')">' + ico('i-copy') + 'نسخ</button>' +
            '<button class="btn sm wa" onclick="App.sendWhatsApp(\'\',' + JSON.stringify(repText) + ')">' + ico('i-wa') + 'واتساب</button>' +
          '</div>' +
        '</div>' +

        /* شريط الملخص الرباعي في الأعلى */
        '<div class="sup-strip">' +
          '<div class="tile">' +
            '<span>عدد الدفعات</span>' +
            '<b>' + curStats.totalPaymentsCount + ' دفعة</b>' +
            '<small>إجمالي دفعات الصرف</small>' +
          '</div>' +
          '<div class="tile">' +
            '<span>المبالغ المحولة (' + curStats.inCount + ')</span>' +
            '<b class="pos">' + money(curStats.totalIn) + '</b>' +
            '<small>' + curStats.inCount + ' حركة وارد</small>' +
          '</div>' +
          '<div class="tile">' +
            '<span>المبالغ المنفقة (' + curStats.outCount + ')</span>' +
            '<b class="neg">' + money(curStats.totalOut) + '</b>' +
            '<small>' + curStats.outCount + ' عملية صرف</small>' +
          '</div>' +
          '<div class="tile">' +
            '<span>الفارق (المحولة − المنفقة)</span>' +
            '<b class="' + (diffVal >= 0 ? 'pos' : 'neg') + '">' + money(diffVal, { sign: true }) + '</b>' +
            '<small>' + esc(diffStatusTxt) + '</small>' +
          '</div>' +
        '</div>' +

        /* جدول التقرير بالأعمدة الأربعة فقط: العامل | المستلم | المتبقي | الدفعات */
        '<div class="tbl-wrap"><table><thead><tr>' +
          '<th>العامل</th><th>المستلم</th><th>المتبقي</th><th>الدفعات</th>' +
        '</tr></thead><tbody>' + curStats.workers.map(w =>
          '<tr>' +
            '<td><b>' + esc(w.name) + '</b></td>' +
            '<td class="pos"><b>' + money(w.received) + '</b></td>' +
            '<td class="' + (w.remaining > 0 ? 'neg' : '') + '"><b>' + money(w.remaining) + '</b></td>' +
            '<td><b>' + w.payments.length + '</b></td>' +
          '</tr>'
        ).join('') + '</tbody><tfoot><tr>' +
          '<td>الإجمالي (' + curStats.workers.length + ' عمال)</td>' +
          '<td class="pos">' + money(curStats.totalOut) + '</td>' +
          '<td>' + money(sum(curStats.workers, w => w.remaining)) + '</td>' +
          '<td>' + curStats.totalPaymentsCount + ' دفعة</td>' +
        '</tr></tfoot></table></div>' +
      '</div>' +
    '</div>';
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   §9  إجراءات قسم أموال الغير + تصدير تقرير المشرف كصورة فائقة الدقة (CustodyAct)
   ═══════════════════════════════════════════════════════════════════════════ */
const CustodyAct = {
  sortMode: 'newest',

  togglePersonalLink() {
    S.custody.linkToPersonal = !S.custody.linkToPersonal;
    commit(S.custody.linkToPersonal ? 'تم تفعيل الربط مع حسابك' : 'تم فصل الصندوق تماماً', 'i');
  },

  claimCommission(fundId, diffAmt) {
    const fd = (S.custody.funds || []).find(f => f.id === fundId);
    if (!fd) return;
    Modals.custodyCommission(fundId, diffAmt);
  },

  deleteEntry(fundId, entryId) {
    const fd = (S.custody.funds || []).find(f => f.id === fundId);
    if (!fd) return;
    Modals.confirm('حذف هذه الحركة؟', () => {
      fd.entries = (fd.entries || []).filter(e => e.id !== entryId);
      commit('تم الحذف');
    });
  },

  settleLoan(loanId) {
    const l = (S.custody.loans || []).find(x => x.id === loanId);
    if (!l) return;
    Modals.confirm('تأكيد سداد ' + mtxt(l.amount) + '؟', () => {
      l.settledAt = todayISO();
      commit('تم السداد');
    }, 'تأكيد السداد');
  },

  /** تصدير تقرير المشرف كصورة PNG عالية الدقة (3x Retina) بدون أي تقطيع أو تداخل للنصوص العربية */
  async exportSupervisorImage(fundId) {
    const fd = (S.custody.funds || []).find(f => f.id === fundId);
    if (!fd) return;
    const st = Eng.custodyFundStats(fd);
    if (document.fonts && document.fonts.ready) {
      try { await document.fonts.ready; } catch (e) {}
    }

    const isDark = (S.ui && S.ui.theme === 'dark');
    const bg       = isDark ? '#0a0f1c' : '#f8fafc';
    const cardBg   = isDark ? '#111a2e' : '#ffffff';
    const tileBg   = isDark ? '#16213a' : '#f1f5f9';
    const border   = isDark ? '#22314f' : '#dde5ef';
    const textMain = isDark ? '#e9eef8' : '#0f172a';
    const textMute = isDark ? '#8194b0' : '#64748b';
    const colOk    = isDark ? '#10b981' : '#059669';
    const colNeg   = isDark ? '#ef4444' : '#dc2626';
    const colAcc   = isDark ? '#38bdf8' : '#0284c7';

    const workers = st.workers || [];
    const W = 860;
    const rowH = 44;
    const headH = 195;
    const tableHeadH = 42;
    const tableFootH = 46;
    const footStripH = 72;
    const H = headH + tableHeadH + Math.max(1, workers.length) * rowH + tableFootH + footStripH + 40;
    const scale = 3;

    const canvas = document.createElement('canvas');
    canvas.width = W * scale;
    canvas.height = H * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.direction = 'rtl';

    const rRect = (x, y, w, h, r, fill, stroke) => {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
    };

    /* الخلفية والبطاقة الرئيسية */
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    rRect(18, 18, W - 36, H - 36, 18, cardBg, border);

    /* الترويسة */
    ctx.fillStyle = colAcc;
    ctx.font = '700 19px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('تقرير تسليم أمانات العمال — ' + fd.name, W - 40, 54);

    ctx.fillStyle = textMute;
    ctx.font = '500 13px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.fillText('المصدر: ' + (fd.source || '—') + '   |   التاريخ: ' + dLabel(todayISO()), W - 40, 78);

    /* شريط الملخص الرباعي في الأعلى */
    const diffVal = st.netDiff;
    const diffLabel = diffVal > 0.01
      ? 'أُنفق أقل مما استُلم (متبقي فائض)'
      : diffVal < -0.01
        ? 'دُفع أكثر مما استُلم (عجز)'
        : 'متطابق (أُنفق كامل المستلم)';

    const kpis = [
      { title: 'عدد الدفعات', val: st.totalPaymentsCount + ' دفعة', sub: 'إجمالي دفعات الصرف', col: textMain },
      { title: 'المبالغ المحولة (' + st.inCount + ')', val: mtxt(st.totalIn), sub: st.inCount + ' حركة وارد', col: colOk },
      { title: 'المبالغ المنفقة (' + st.outCount + ')', val: mtxt(st.totalOut), sub: st.outCount + ' عملية صرف', col: colNeg },
      { title: 'الفارق (المحولة − المنفقة)', val: (diffVal > 0 ? '+' : '') + mtxt(diffVal), sub: diffLabel, col: diffVal >= 0 ? colOk : colNeg }
    ];

    const tileW = (W - 80 - 24) / 4;
    kpis.forEach((k, idx) => {
      const tx = W - 40 - (idx + 1) * tileW - idx * 8;
      const ty = 94;
      rRect(tx, ty, tileW, 78, 11, tileBg, border);
      ctx.textAlign = 'center';
      const cx = tx + tileW / 2;
      ctx.fillStyle = textMute;
      ctx.font = '600 11px "IBM Plex Sans Arabic", Tahoma, sans-serif';
      ctx.fillText(k.title, cx, ty + 22);
      ctx.fillStyle = k.col;
      ctx.font = '700 15px "IBM Plex Sans Arabic", Tahoma, sans-serif';
      ctx.fillText(k.val, cx, ty + 46);
      ctx.fillStyle = textMute;
      ctx.font = '500 10px "IBM Plex Sans Arabic", Tahoma, sans-serif';
      ctx.fillText(k.sub, cx, ty + 66);
    });

    /* إحداثيات أعمدة الجدول الأربعة: العامل | المستلم | المتبقي | الدفعات */
    const tblX = 40, tblW = W - 80;
    let curY = headH;
    rRect(tblX, curY, tblW, tableHeadH, 10, tileBg, border);

    const colX = [
      W - 58,           // 1. العامل (يمين)
      W - 350,          // 2. المستلم
      W - 540,          // 3. المتبقي
      W - 715           // 4. الدفعات (يسار)
    ];

    ctx.fillStyle = textMute;
    ctx.font = '700 12.5px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('العامل', colX[0], curY + 26);
    ctx.fillText('المستلم', colX[1], curY + 26);
    ctx.fillText('المتبقي', colX[2], curY + 26);
    ctx.fillText('الدفعات', colX[3], curY + 26);
    curY += tableHeadH;

    if (!workers.length) {
      ctx.fillStyle = textMute;
      ctx.textAlign = 'center';
      ctx.font = '500 13px "IBM Plex Sans Arabic", Tahoma, sans-serif';
      ctx.fillText('لا يوجد عمال مسجلون في هذا الصندوق', W / 2, curY + 28);
      curY += rowH;
    } else {
      workers.forEach((w, idx) => {
        if (idx % 2 === 1) {
          ctx.fillStyle = isDark ? 'rgba(255,255,255,0.02)' : 'rgba(15,23,42,0.02)';
          ctx.fillRect(tblX, curY, tblW, rowH);
        }
        ctx.strokeStyle = border;
        ctx.beginPath();
        ctx.moveTo(tblX, curY + rowH);
        ctx.lineTo(tblX + tblW, curY + rowH);
        ctx.stroke();

        ctx.textAlign = 'right';
        ctx.fillStyle = textMain;
        ctx.font = '700 13.5px "IBM Plex Sans Arabic", Tahoma, sans-serif';
        ctx.fillText(w.name, colX[0], curY + 27);

        ctx.fillStyle = colOk;
        ctx.fillText(mtxt(w.received), colX[1], curY + 27);

        ctx.fillStyle = w.remaining > 0.01 ? colNeg : textMain;
        ctx.fillText(mtxt(w.remaining), colX[2], curY + 27);

        ctx.fillStyle = textMain;
        ctx.fillText(w.payments.length + ' دفعة', colX[3], curY + 27);
        curY += rowH;
      });
    }

    /* صف الإجمالي */
    rRect(tblX, curY, tblW, tableFootH, 10, tileBg, border);
    ctx.textAlign = 'right';
    ctx.fillStyle = textMain;
    ctx.font = '700 13.5px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.fillText('الإجمالي (' + workers.length + ' عمال)', colX[0], curY + 28);
    ctx.fillStyle = colOk;
    ctx.fillText(mtxt(st.totalOut), colX[1], curY + 28);
    ctx.fillStyle = textMain;
    ctx.fillText(mtxt(sum(workers, w => w.remaining)), colX[2], curY + 28);
    ctx.fillText(st.totalPaymentsCount + ' دفعة', colX[3], curY + 28);
    curY += tableFootH + 14;

    /* شريط خلاصة الفارق النهائي في الأسفل */
    rRect(tblX, curY, tblW, 46, 10, tileBg, border);
    ctx.fillStyle = textMain;
    ctx.font = '600 12px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(
      'عدد الدفعات: ' + st.totalPaymentsCount +
      '   |   المبالغ المحولة (' + st.inCount + '): ' + mtxt(st.totalIn) +
      '   |   المبالغ المنفقة (' + st.outCount + '): ' + mtxt(st.totalOut) +
      '   |   الفارق: ' + mtxt(diffVal) + ' — ' + diffLabel,
      W / 2, curY + 28
    );

    canvas.toBlob(blob => {
      if (!blob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'تقرير-المشرف-' + fd.name.replace(/\s+/g, '-') + '-' + todayISO() + '.png';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast('تم تصدير صورة التقرير بدقة عالية (3x)', 's');
    }, 'image/png');
  }
};
