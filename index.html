            '<div class="m-card">' +
              '<div class="m-top">' +
                '<div class="m-av" style="background:var(--brand-soft);color:var(--brand)">' + ico('i-bank') + '</div>' +
                '<div style="flex:1;min-width:0">' +
                  '<div class="m-name">' + esc(b.name) + '</div>' +
                  '<div class="m-role">' + esc(b.kind || 'بنك') + '</div>' +
                '</div>' +
                '<div class="row-acts">' +
                  '<button onclick="Modals.bankAccount(\'' + b.id + '\')" title="تعديل">' + ico('i-edit') + '</button>' +
                  '<button class="del" onclick="TreasuryAct.deleteBank(\'' + b.id + '\')" title="حذف">' + ico('i-trash') + '</button>' +
                '</div>' +
              '</div>' +
              '<div class="m-bal ' + (b.balance >= 0 ? 'pos' : 'neg') + '">' + money(b.balance) + '</div>' +
              '<div class="m-sub">' +
                '<button class="btn sm" onclick="Modals.personalTx(\'out\',\'' + b.id + '\')">صرف</button>' +
                '<button class="btn sm" onclick="Modals.walletTransfer(\'' + b.id + '\')">تحويل</button>' +
                (reconEnabled ? '<button class="btn sm soft" onclick="Modals.reconcileWallet(\'' + b.id + '\',\'' + esc(b.name) + '\')">مطابقة</button>' : '') +
              '</div>' +
            '</div>'
          ).join('') +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-h"><h3>' + ico('i-lock') + 'الخزائن الثلاث المستقلة</h3></div>' +
        '<div class="grid g3">' +
          '<div class="tile" style="text-align:start;padding:11px;border-inline-start:3px solid var(--treasury)">' +
            '<span>1. الخزينة الشخصية</span>' +
            '<b class="pos" style="font-size:16px">' + moneyCore(T.total) + '</b>' +
            '<small>كاش (' + fmt(T.cash) + ') + بنوك (' + fmt(T.banksTotal) + ')</small>' +
          '</div>' +
          '<div class="tile" style="text-align:start;padding:11px;border-inline-start:3px solid var(--uzba)">' +
            '<span>2. خزينة العزبة</span>' +
            '<b style="font-size:16px;color:var(--uzba)">' + moneyCore(UV.balance) + '</b>' +
            '<small>مستقلة لقسم العزبة</small>' +
          '</div>' +
          '<div class="tile" style="text-align:start;padding:11px;border-inline-start:3px solid var(--custody)">' +
            '<span>3. خزينة أموال الغير</span>' +
            '<b style="font-size:16px;color:var(--custody)">' + moneyCore(CV.balance) + '</b>' +
            '<small>أمانة مستقلة للعمال</small>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
    return;
  }

  if (sub === 'transactions') {
    const q = (TreasuryAct.filterQ || '').trim().toLowerCase();
    const fKind = TreasuryAct.filterKind || 'all';
    const fTag = TreasuryAct.filterTag || 'all';

    const allTags = [];
    (S.personal.transactions || []).forEach(t => {
      (t.tags || []).forEach(tg => { if (allTags.indexOf(tg) === -1) allTags.push(tg); });
    });

    const rows = (S.personal.transactions || []).filter(t => {
      if (fKind !== 'all' && t.kind !== fKind) return false;
      if (fTag !== 'all' && (t.tags || []).indexOf(fTag) === -1) return false;
      if (q) {
        const hay = ((t.description || '') + ' ' + (t.category || '') + ' ' + (t.tags || []).join(' ')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    }).sort((a, b) => b.date.localeCompare(a.date));

    el.innerHTML = navHTML + '<div class="card">' +
      '<div class="card-h">' +
        '<h3>' + ico('i-layers') + 'العمليات الشخصية</h3>' +
        '<div class="right">' +
          '<button class="btn sm primary" onclick="Modals.personalTx(\'in\')">' + ico('i-plus') + 'إيراد</button>' +
          '<button class="btn sm danger" onclick="Modals.personalTx(\'out\')">' + ico('i-plus') + 'مصروف</button>' +
        '</div>' +
      '</div>' +
      '<div class="tbl-tools">' +
        '<input type="search" class="search" placeholder="بحث…" value="' + esc(TreasuryAct.filterQ || '') + '" oninput="TreasuryAct.filterQ=this.value;App.render()">' +
        '<select onchange="TreasuryAct.filterKind=this.value;App.render()">' +
          '<option value="all">الكل</option>' +
          '<option value="in"' + (fKind === 'in' ? ' selected' : '') + '>الإيرادات</option>' +
          '<option value="out"' + (fKind === 'out' ? ' selected' : '') + '>المصروفات</option>' +
        '</select>' +
        (allTags.length ? (
          '<select onchange="TreasuryAct.filterTag=this.value;App.render()">' +
            '<option value="all">كل الوسوم</option>' +
            allTags.map(tg => '<option value="' + esc(tg) + '"' + (fTag === tg ? ' selected' : '') + '>#' + esc(tg) + '</option>').join('') +
          '</select>'
        ) : '') +
      '</div>' +
      (rows.length ? '<div class="tbl-wrap"><table><thead><tr>' +
        '<th style="width:66px">التاريخ</th><th>البيان</th><th>المبلغ</th><th style="width:68px"></th>' +
      '</tr></thead><tbody>' + rows.map(t => {
        const wName = t.walletId === 'cash' ? 'كاش' : (((S.personal.banks || []).find(b => b.id === t.walletId) || {}).name || 'بنك');
        const tagsHTML = (t.tags || []).map(tg => '<span class="tag-chip">#' + esc(tg) + '</span>').join('');
        return '<tr>' +
          '<td style="white-space:nowrap">' + dShort(t.date) + '</td>' +
          '<td>' +
            '<span class="badge ' + (t.kind === 'in' ? 'b-ok' : 'b-danger') + '">' + (t.kind === 'in' ? 'إيراد' : 'مصروف') + '</span> ' +
            '<b>' + esc(t.category || 'عام') + '</b>' +
            (t.description ? ' · ' + esc(t.description) : '') +
            tagsHTML +
          '</td>' +
          '<td><b class="' + (t.kind === 'in' ? 'pos' : 'neg') + '">' + money(t.kind === 'in' ? t.amount : -t.amount, { sign: true }) + '</b><br><small style="color:var(--muted)">' + esc(wName) + '</small></td>' +
          '<td><div class="row-acts">' +
            '<button onclick="Modals.personalTx(\'' + t.kind + '\',\'\',\'' + t.id + '\')" title="تعديل">' + ico('i-edit') + '</button>' +
            '<button class="del" onclick="TreasuryAct.deleteTx(\'' + t.id + '\')" title="حذف">' + ico('i-trash') + '</button>' +
          '</div></td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>' : '<div class="empty"><p>لا عمليات مطابقة</p></div>') +
    '</div>';
    return;
  }

  if (sub === 'categories') {
    const catSec = TreasuryAct.catSection || 'personalOut';
    const catList = catSec === 'personalIn' ? S.personal.categoriesIn
                  : catSec === 'uzba' ? S.uzba.categories
                  : catSec === 'custody' ? S.custody.categories
                  : S.personal.categoriesOut;

    el.innerHTML = navHTML + '<div class="stack">' +
      '<div class="card">' +
        '<div class="card-h">' +
          '<h3>' + ico('i-layers') + 'تصنيفات الأقسام</h3>' +
          '<div class="right"><button class="btn sm primary" onclick="Modals.addCategory(\'' + catSec + '\')">' + ico('i-plus') + 'تصنيف جديد</button></div>' +
        '</div>' +
        '<div class="chips" style="margin-bottom:10px">' +
          '<button class="chip ' + (catSec === 'personalOut' ? 'on' : '') + '" onclick="TreasuryAct.catSection=\'personalOut\';App.render()">مصروفات (' + S.personal.categoriesOut.length + ')</button>' +
          '<button class="chip ' + (catSec === 'personalIn' ? 'on' : '') + '" onclick="TreasuryAct.catSection=\'personalIn\';App.render()">إيرادات (' + S.personal.categoriesIn.length + ')</button>' +
          '<button class="chip ' + (catSec === 'uzba' ? 'on' : '') + '" onclick="TreasuryAct.catSection=\'uzba\';App.render()">العزبة (' + S.uzba.categories.length + ')</button>' +
          '<button class="chip ' + (catSec === 'custody' ? 'on' : '') + '" onclick="TreasuryAct.catSection=\'custody\';App.render()">أموال الغير (' + S.custody.categories.length + ')</button>' +
        '</div>' +
        '<div class="chips">' + catList.map((c, idx) =>
          '<span class="badge b-mute" style="padding:5px 10px;font-size:11.5px">' + esc(c) +
            ' <button style="margin-inline-start:5px;color:var(--danger)" onclick="TreasuryAct.removeCategory(\'' + catSec + '\',' + idx + ')">×</button>' +
          '</span>'
        ).join('') + '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-h">' +
          '<h3>' + ico('i-bridge') + 'التحويلات بين الكاش والبنوك</h3>' +
          '<div class="right"><button class="btn sm soft" onclick="Modals.walletTransfer()">' + ico('i-plus') + 'تحويل</button></div>' +
        '</div>' +
        ((S.personal.transfers || []).length ? '<div class="list">' + S.personal.transfers.slice().reverse().map(tr => {
          const wLabel = id => id === 'cash' ? 'الكاش' : (((S.personal.banks || []).find(b => b.id === id) || {}).name || 'بنك');
          return '<div class="list-item">' +
            '<div class="li-main"><b>' + esc(wLabel(tr.fromId)) + ' ← ' + esc(wLabel(tr.toId)) + '</b><small>' + dShort(tr.date) + (tr.note ? ' · ' + esc(tr.note) : '') + '</small></div>' +
            '<div class="li-end" style="display:flex;align-items:center;gap:6px"><b>' + money(tr.amount) + '</b>' +
              '<button class="btn sm danger" onclick="TreasuryAct.deleteTransfer(\'' + tr.id + '\')">' + ico('i-trash') + '</button>' +
            '</div>' +
          '</div>';
        }).join('') + '</div>' : '<div class="empty"><p>لا تحويلات مسجلة</p></div>') +
      '</div>' +
    '</div>';
  }
};

const TreasuryAct = {
  filterQ: '', filterKind: 'all', filterTag: 'all', catSection: 'personalOut',

  deleteBank(id) {
    Modals.confirm('حذف هذا الحساب البنكي؟', () => {
      S.personal.banks = (S.personal.banks || []).filter(b => b.id !== id);
      commit('تم الحذف');
    });
  },
  deleteTx(id) {
    Modals.confirm('حذف هذه العملية؟', () => {
      S.personal.transactions = (S.personal.transactions || []).filter(t => t.id !== id);
      commit('تم الحذف');
    });
  },
  deleteTransfer(id) {
    Modals.confirm('حذف هذا التحويل؟', () => {
      S.personal.transfers = (S.personal.transfers || []).filter(t => t.id !== id);
      commit('تم الحذف');
    });
  },
  removeCategory(sec, idx) {
    const arr = sec === 'personalIn' ? S.personal.categoriesIn
              : sec === 'uzba' ? S.uzba.categories
              : sec === 'custody' ? S.custody.categories
              : S.personal.categoriesOut;
    if (arr.length <= 1) { toast('يجب إبقاء تصنيف واحد على الأقل', 'e'); return; }
    arr.splice(idx, 1);
    commit('تم حذف التصنيف');
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   §11  الشاشة 4: قسم الديون 📜
   ═══════════════════════════════════════════════════════════════════════════ */
Pages.debts = function (el) {
  const D = Eng.debtsSummary();
  const sub = (S.ui.sub && S.ui.sub.debts) || 'owed';

  const subTabs = [
    { k: 'owed',  t: 'دَينٌ لك (عند الآخرين)', i: 'i-debts', n: D.owed.filter(x => x.remain > 0.01).length },
    { k: 'owing', t: 'دَينٌ عليك (للآخرين)',  i: 'i-clock', n: D.owing.filter(x => x.remain > 0.01).length }
  ];

  const navHTML = '<div class="subnav"><div class="sn-track">' + subTabs.map(t =>
    '<button class="' + (sub === t.k ? 'on' : '') + '" onclick="App.setSub(\'debts\',\'' + t.k + '\')">' +
    ico(t.i) + '<span>' + esc(t.t) + '</span>' +
    (t.n ? '<em>' + t.n + '</em>' : '') + '</button>'
  ).join('') + '</div></div>';

  const list = sub === 'owed' ? D.owed : D.owing;
  const isOwed = sub === 'owed';

  el.innerHTML = navHTML + '<div class="stack">' +
    '<div class="pghero">' +
      '<div>' +
        '<div class="ph-cap">' + ico('i-debts') + '<span>' + (isOwed ? 'إجمالي الديون التي لك' : 'إجمالي الديون التي عليك') + '</span>' + eyeBtn() + '</div>' +
        '<div class="ph-big ' + (isOwed ? 'pos' : 'neg') + '">' + moneyCore(isOwed ? D.owedOpen : D.owingOpen) + '</div>' +
        '<div class="ph-chips">' +
          '<span class="badge b-ok">لك: ' + moneyCore(D.owedOpen) + '</span>' +
          '<span class="badge b-danger">عليك: ' + moneyCore(D.owingOpen) + '</span>' +
        '</div>' +
      '</div>' +
      '<div>' +
        '<button class="btn primary block" style="padding:11px" onclick="Modals.debtForm(\'' + sub + '\')">' +
          ico('i-plus') + 'تسجيل دَين (لي / عليّ)' +
        '</button>' +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-h">' +
        '<h3>' + ico('i-layers') + (isOwed ? 'ديون لك عند الآخرين' : 'ديون عليك للآخرين') + '</h3>' +
      '</div>' +
      (list.length ? '<div class="grid g2">' + list.map(x => {
        const d = x.d;
        const pctPaid = d.amount > 0 ? clamp((x.paid / d.amount) * 100, 0, 100) : 100;
        const delivLabel = d.deliveryMethod === 'transfer' ? 'حوالة' : 'كاش';
        const waMsg = isOwed
          ? ('السلام عليكم يا ' + d.person + '، تذكير ودي بمبلغ الدين المتبقي (' + mtxt(x.remain) + ') المستحق بتاريخ ' + dLabel(d.dueDate) + '.')
          : ('تحديث سداد دَين لـ ' + d.person + ': المتبقي ' + mtxt(x.remain));
        return '<div class="m-card">' +
          '<div class="m-top">' +
            '<div class="m-av">' + esc(d.person.charAt(0)) + '</div>' +
            '<div style="flex:1;min-width:0">' +
              '<div class="m-name">' + esc(d.person) + '</div>' +
              '<div class="m-role">' + delivLabel + ' · استحقاق: ' + dShort(d.dueDate) + '</div>' +
            '</div>' +
            '<span class="badge ' + x.badge + '">' + esc(x.label) + '</span>' +
          '</div>' +
          '<div class="ph-kpis" style="margin:5px 0">' +
            '<div class="tile"><span>الأصل</span><b>' + money(d.amount) + '</b></div>' +
            '<div class="tile"><span>المسدَّد</span><b class="pos">' + money(x.paid) + '</b></div>' +
            '<div class="tile"><span>المتبقي</span><b class="' + (x.remain > 0.01 ? 'neg' : '') + '">' + money(x.remain) + '</b></div>' +
          '</div>' +
          '<div class="bar"><i style="width:' + pctPaid.toFixed(1) + '%;background:var(--ok)"></i></div>' +
          ((d.payments || []).length ? (
            '<div style="font-size:10.5px;color:var(--muted);margin-top:3px">' +
              'الدفعات: ' + d.payments.map(p => fmt(p.amount) + ' (' + (p.method === 'transfer' ? 'حوالة' : 'كاش') + ')').join(' ، ') +
            '</div>'
          ) : '') +
          '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;padding-top:5px;border-top:1px dashed var(--border)">' +
            (x.remain > 0.01 ? '<button class="btn sm primary" onclick="Modals.debtPayment(\'' + sub + '\',\'' + d.id + '\')">' + ico('i-cash') + 'سداد دفعة</button>' : '') +
            '<button class="btn sm wa" onclick="App.sendWhatsApp(\'' + esc(d.phone || '') + '\',' + JSON.stringify(waMsg) + ')">' + ico('i-wa') + '</button>' +
            '<button class="btn sm" onclick="Modals.debtForm(\'' + sub + '\',\'' + d.id + '\')">' + ico('i-edit') + '</button>' +
            '<button class="btn sm danger" style="margin-inline-start:auto" onclick="DebtsAct.deleteDebt(\'' + sub + '\',\'' + d.id + '\')">' + ico('i-trash') + '</button>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>' : '<div class="empty"><p>لا ديون مسجلة</p></div>') +
    '</div>' +
  '</div>';
};

const DebtsAct = {
  deleteDebt(kind, id) {
    Modals.confirm('حذف هذا الدين؟', () => {
      S.personal.debts[kind] = (S.personal.debts[kind] || []).filter(d => d.id !== id);
      commit('تم الحذف');
    });
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   §12  الشاشة 5: قسم التقارير 📊
   ═══════════════════════════════════════════════════════════════════════════ */
let repCharts = { bar: null, pie: null };

Pages.reports = function (el) {
  const mode = Pages._repMode || 'month';
  const sec  = Pages._repSec  || 'personal';
  const t0 = todayISO();
  let dFrom = Pages._repFrom || isoShift(t0, -30);
  let dTo   = Pages._repTo   || t0;

  if (mode === 'day')   { dFrom = t0; dTo = t0; }
  if (mode === 'week')  { dFrom = isoShift(t0, -6); dTo = t0; }
  if (mode === 'month') { dFrom = isoShift(t0, -29); dTo = t0; }

  let totalIn = 0, totalOut = 0;
  const catMap = {};

  if (sec === 'personal') {
    (S.personal.transactions || []).filter(t => t.date >= dFrom && t.date <= dTo).forEach(t => {
      if (t.kind === 'in') totalIn += N(t.amount);
      else {
        totalOut += N(t.amount);
        const c = t.category || 'أخرى';
        catMap[c] = (catMap[c] || 0) + N(t.amount);
      }
    });
  } else if (sec === 'uzba') {
    const room = Eng.activeRoom();
    if (room) {
      totalIn = sum((room.vaultEntries || []).filter(e => e.dir === 'in' && e.date >= dFrom && e.date <= dTo), e => e.amount);
      (room.items || []).filter(it => it.date >= dFrom && it.date <= dTo).forEach(it => {
        totalOut += N(it.total);
        const c = it.category || 'أخرى';
        catMap[c] = (catMap[c] || 0) + N(it.total);
      });
    }
  } else if (sec === 'custody') {
    (S.custody.funds || []).forEach(fd => {
      (fd.entries || []).filter(e => e.date >= dFrom && e.date <= dTo).forEach(e => {
        if (e.dir === 'in') totalIn += N(e.amount);
        else {
          totalOut += N(e.amount);
          const c = e.category || e.purpose || 'توزيع عمال';
          catMap[c] = (catMap[c] || 0) + N(e.amount);
        }
      });
    });
  }

  el.innerHTML = '<div class="stack">' +
    '<div class="card">' +
      '<div class="card-h"><h3>' + ico('i-chart') + 'التقارير' + eyeBtn() + '</h3></div>' +
      '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
        '<div class="chips">' +
          '<button class="chip ' + (mode === 'day' ? 'on' : '') + '" onclick="Pages._repMode=\'day\';App.render()">يومي</button>' +
          '<button class="chip ' + (mode === 'week' ? 'on' : '') + '" onclick="Pages._repMode=\'week\';App.render()">أسبوعي</button>' +
          '<button class="chip ' + (mode === 'month' ? 'on' : '') + '" onclick="Pages._repMode=\'month\';App.render()">شهري</button>' +
          '<button class="chip ' + (mode === 'custom' ? 'on' : '') + '" onclick="Pages._repMode=\'custom\';App.render()">مخصص</button>' +
        '</div>' +
        '<div class="chips">' +
          '<button class="chip ' + (sec === 'personal' ? 'on' : '') + '" onclick="Pages._repSec=\'personal\';App.render()">الخزينة</button>' +
          '<button class="chip ' + (sec === 'uzba' ? 'on' : '') + '" onclick="Pages._repSec=\'uzba\';App.render()">العزبة</button>' +
          '<button class="chip ' + (sec === 'custody' ? 'on' : '') + '" onclick="Pages._repSec=\'custody\';App.render()">أموال الغير</button>' +
        '</div>' +
      '</div>' +
      (mode === 'custom' ? (
        '<div class="row-2" style="margin-bottom:10px">' +
          '<div class="field"><label>من</label><input type="date" value="' + esc(dFrom) + '" onchange="Pages._repFrom=this.value;App.render()"></div>' +
          '<div class="field"><label>إلى</label><input type="date" value="' + esc(dTo) + '" onchange="Pages._repTo=this.value;App.render()"></div>' +
        '</div>'
      ) : '') +
      '<div class="ph-kpis">' +
        '<div class="tile"><span>الوارد</span><b class="pos">' + money(totalIn) + '</b></div>' +
        '<div class="tile"><span>المنصرف</span><b class="neg">' + money(totalOut) + '</b></div>' +
        '<div class="tile"><span>الصافي</span><b class="' + (totalIn - totalOut >= 0 ? 'pos' : 'neg') + '">' + money(totalIn - totalOut, { sign: true }) + '</b></div>' +
      '</div>' +
    '</div>' +

    '<div class="split even">' +
      '<div class="card">' +
        '<div class="card-h"><h3>الإيرادات والمصروفات</h3></div>' +
        '<div class="chart-box"><canvas id="repBarCanvas"></canvas></div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-h"><h3>توزيع التصنيفات</h3></div>' +
        '<div class="chart-box"><canvas id="repPieCanvas"></canvas></div>' +
      '</div>' +
    '</div>' +
  '</div>';

  if (typeof Chart !== 'undefined') {
    try { if (repCharts.bar) repCharts.bar.destroy(); } catch (e) {}
    try { if (repCharts.pie) repCharts.pie.destroy(); } catch (e) {}

    const barEl = $('#repBarCanvas');
    if (barEl) {
      repCharts.bar = new Chart(barEl, {
        type: 'bar',
        data: {
          labels: ['الوارد', 'المنصرف'],
          datasets: [{
            label: CUR,
            data: [totalIn, totalOut],
            backgroundColor: ['#10b981', '#ef4444'],
            borderRadius: 8,
            maxBarThickness: 50
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } }
        }
      });
    }

    const pieEl = $('#repPieCanvas');
    const cKeys = Object.keys(catMap);
    if (pieEl) {
      repCharts.pie = new Chart(pieEl, {
        type: 'doughnut',
        data: {
          labels: cKeys.length ? cKeys : ['لا مصروفات'],
          datasets: [{
            data: cKeys.length ? cKeys.map(k => catMap[k]) : [1],
            backgroundColor: cKeys.length
              ? ['#ea580c', '#0284c7', '#059669', '#4f46e5', '#e11d48', '#d97706', '#8b5cf6']
              : ['#cbd5e1']
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          cutout: '58%',
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   §13  النوافذ المنبثقة الذكية والمتناسقة (Modals)
   ═══════════════════════════════════════════════════════════════════════════ */
const Modals = {
  open(o) {
    const wasOpen = $('#modal').classList.contains('on');
    $('#modalCard').className = 'modal-card ' + (o.wide ? 'wide ' : '') + (o.ctx ? 'ctx-' + o.ctx : '');
    $('#modalIco').innerHTML = ico(o.i || 'i-plus');
    $('#modalTitle').textContent = o.t || '—';
    $('#modalSub').textContent = o.sub || '';
    $('#modalBody').innerHTML = o.b || '';
    $('#modalFoot').innerHTML = o.f || '<button class="btn" onclick="Modals.close()">إغلاق</button>';
    $('#modal').classList.add('on');
    if (!wasOpen && typeof App !== 'undefined' && App.pushHistoryState) {
      App.pushHistoryState({ tab: S.ui.tab, sub: (S.ui.sub && S.ui.sub[S.ui.tab]) || '', modal: true });
    }
    Txt.apply($('#modalCard'));
  },
  close(fromPopState) {
    const wasOpen = $('#modal').classList.contains('on');
    $('#modal').classList.remove('on');
    if (wasOpen && !fromPopState && window.history && window.history.state && window.history.state.modal) {
      try { App._suppressPop = true; window.history.back(); } catch (e) { App._suppressPop = false; }
    }
  },
  confirm(msg, onYes, title) {
    const wasOpen = $('#confirm').classList.contains('on');
    $('#cfMsg').textContent = msg;
    $('#cfTitle').textContent = title || 'تأكيد';
    const btn = $('#cfYes'), clone = btn.cloneNode(true);
    btn.parentNode.replaceChild(clone, btn);
    clone.addEventListener('click', () => { Modals.closeConfirm(); onYes(); });
    $('#confirm').classList.add('on');
    if (!wasOpen && typeof App !== 'undefined' && App.pushHistoryState) {
      App.pushHistoryState({ tab: S.ui.tab, sub: (S.ui.sub && S.ui.sub[S.ui.tab]) || '', confirm: true });
    }
  },
  closeConfirm(fromPopState) {
    const wasOpen = $('#confirm').classList.contains('on');
    $('#confirm').classList.remove('on');
    if (wasOpen && !fromPopState && window.history && window.history.state && window.history.state.confirm) {
      try { App._suppressPop = true; window.history.back(); } catch (e) { App._suppressPop = false; }
    }
  },

  /* ── 1. نافذة إضافة وجبة أو عزبة (حقل الوجبة + المبلغ + التاريخ الذكي في نفس السطر) ── */
  uzbaQuickMeal(preset, editId) {
    const room = Eng.activeRoom();
    if (!room) return;
    const myName = (S.user && S.user.name || '').trim();
    const meMember = (room.members || []).find(m => m.name.trim() === myName) || room.members[0];
    const editItem = editId ? (room.items || []).find(x => x.id === editId) : null;

    const descVal = editItem ? editItem.description : (preset || 'فطور');
    const totVal  = editItem ? editItem.total : '';
    const dateVal = editItem ? editItem.date : todayISO();

    let pMode = 'me';
    let otherId = (room.members.find(m => m.id !== meMember.id) || meMember).id;
    const payerMap = {};
    if (editItem) {
      (editItem.payers || []).forEach(p => { payerMap[p.memberId] = p.amount; });
      if ((editItem.payers || []).length > 1) pMode = 'shared';
      else if (editItem.payers && editItem.payers[0] && editItem.payers[0].memberId !== meMember.id) {
        pMode = 'other';
        otherId = editItem.payers[0].memberId;
      }
    }
    this._qmPayerMode = pMode;
    this._qmOtherId = otherId;
    this._qmMeId = meMember.id;

    const partIds = editItem
      ? (editItem.participants || [])
      : (room.members || []).filter(m => m.active && m.isPermanent).map(m => m.id);

    const presets = ['فطور', 'غداء', 'عشاء', 'مقاضي', 'قهوة'];

    this.open({
      t: editItem ? 'تعديل الوجبة' : 'تسجيل وجبة / عزبة',
      sub: '',
      i: 'i-uzba', ctx: 'uzba',
      b: '<div class="stack">' +
        /* أزرار سريعة لاختيار الوجبة */
        '<div class="chips">' +
          presets.map(p => '<button type="button" class="chip qm-pchip' + (descVal === p ? ' on' : '') + '" onclick="Modals.pickMealPreset(\'' + p + '\')">' + p + '</button>').join('') +
        '</div>' +

        /* السطر الموحد: [حقل الوجبة] + [حقل المبلغ] + [حقل التاريخ الذكي المختصر] */
        '<div class="row-3">' +
          '<div class="field">' +
            '<label>الوجبة <span class="req">*</span></label>' +
            '<input type="text" id="qm_desc" value="' + esc(descVal) + '" placeholder="فطور، غداء…">' +
          '</div>' +
          '<div class="field">' +
            '<label>المبلغ (' + CUR + ') <span class="req">*</span></label>' +
            '<input type="number" id="qm_total" step="any" min="0.01" inputmode="decimal" value="' + esc(totVal) + '" placeholder="0.00" oninput="Modals.syncQuickMeal()">' +
          '</div>' +
          smartDateField('qm_date', dateVal, 'التاريخ') +
        '</div>' +

        /* من دفع؟ */
        '<div class="field">' +
          '<label>من دفع؟</label>' +
          '<div class="chips" style="margin-bottom:7px">' +
            '<button type="button" class="chip ' + (pMode === 'me' ? 'on' : '') + '" id="qm_pm_me" onclick="Modals.setQmPayerMode(\'me\')">أنا دفعت (' + esc(meMember.name) + ')</button>' +
            '<button type="button" class="chip ' + (pMode === 'other' ? 'on' : '') + '" id="qm_pm_other" onclick="Modals.setQmPayerMode(\'other\')">شخص آخر</button>' +
            '<button type="button" class="chip ' + (pMode === 'shared' ? 'on' : '') + '" id="qm_pm_shared" onclick="Modals.setQmPayerMode(\'shared\')">تشاركنا الدفعة</button>' +
          '</div>' +

          '<div id="qm_other_box" style="display:' + (pMode === 'other' ? 'flex' : 'none') + '" class="chips">' +
            (room.members || []).map(m =>
              '<button type="button" class="chip qm-other-chip ' + (m.id === otherId ? 'on' : '') + '" data-mid="' + esc(m.id) + '" onclick="Modals.selectQmOther(\'' + m.id + '\')">' + esc(m.name) + '</button>'
            ).join('') +
          '</div>' +

          '<div id="qm_shared_box" style="display:' + (pMode === 'shared' ? 'flex' : 'none') + ';flex-direction:column;gap:5px">' +
            (room.members || []).map(m =>
              '<div class="payer-row" id="qm_prow_' + esc(m.id) + '">' +
                '<span>' + esc(m.name) + '</span>' +
                '<input type="number" step="any" min="0" class="qm-shared-inp" data-mid="' + esc(m.id) + '" data-mname="' + esc(m.name) + '" value="' + esc(payerMap[m.id] !== undefined ? payerMap[m.id] : '') + '" placeholder="كم دفع؟" oninput="Modals.syncQuickMeal()">' +
              '</div>'
            ).join('') +
          '</div>' +
          '<div class="hint" id="qm_payer_summary" style="font-weight:700;color:var(--text);margin-top:5px"></div>' +
        '</div>' +

        /* المشاركون */
        '<div class="field">' +
          '<label>المشاركون في الوجبة</label>' +
          '<div class="chips" id="qm_part_chips">' +
            (room.members || []).map(m => {
              const on = partIds.indexOf(m.id) > -1;
              return '<button type="button" class="chip ' + (on ? 'on' : '') + '" data-mid="' + esc(m.id) + '" onclick="this.classList.toggle(\'on\');Modals.syncQuickMeal()">' +
                esc(m.name) + (!m.isPermanent ? ' (ضيف)' : '') +
              '</button>';
            }).join('') +
          '</div>' +
          '<div class="hint" id="qm_share_summary" style="color:var(--uzba);font-weight:600;margin-top:4px"></div>' +
        '</div>' +
      '</div>',
      f: editItem
        ? ('<button class="btn primary" onclick="Modals.saveQuickMeal(\'now\',\'' + editItem.id + '\')">' + ico('i-check') + 'حفظ</button>' +
           '<button class="btn" onclick="Modals.close()">إلغاء</button>')
        : ('<button class="btn primary" onclick="Modals.saveQuickMeal(\'now\',\'\')">' + ico('i-check') + 'توزيع فوري الآن</button>' +
           '<button class="btn soft" onclick="Modals.saveQuickMeal(\'stage\',\'\')">' + ico('i-clock') + 'حفظ بالدفتر (توزيع لاحقاً)</button>')
    });

    this.syncQuickMeal();
  },

  pickMealPreset(p) {
    const inp = $('#qm_desc');
    if (inp) inp.value = p;
    $$('#modalBody .qm-pchip').forEach(c => c.classList.toggle('on', c.textContent === p));
  },

  setQmPayerMode(mode) {
    this._qmPayerMode = mode;
    ['me', 'other', 'shared'].forEach(k => {
      const b = $('#qm_pm_' + k);
      if (b) b.classList.toggle('on', k === mode);
    });
    const ob = $('#qm_other_box'), sb = $('#qm_shared_box');
    if (ob) ob.style.display = mode === 'other' ? 'flex' : 'none';
    if (sb) sb.style.display = mode === 'shared' ? 'flex' : 'none';
    this.syncQuickMeal();
  },

  selectQmOther(mid) {
    this._qmOtherId = mid;
    $$('.qm-other-chip').forEach(c => c.classList.toggle('on', c.dataset.mid === mid));
    this.syncQuickMeal();
  },

  syncQuickMeal() {
    const room = Eng.activeRoom();
    if (!room) return;
    const tot = N(($('#qm_total') || {}).value);
    const pSumEl = $('#qm_payer_summary');
    const shSumEl = $('#qm_share_summary');

    if (pSumEl) {
      if (this._qmPayerMode === 'me') {
        const mName = Eng.memberName(room, this._qmMeId);
        pSumEl.innerHTML = 'الدافع: <span style="color:var(--ok)">' + esc(mName) + (tot > 0 ? ' (' + mtxt(tot) + ')' : '') + '</span>';
      } else if (this._qmPayerMode === 'other') {
        const mName = Eng.memberName(room, this._qmOtherId);
        pSumEl.innerHTML = 'الدافع: <span style="color:var(--ok)">' + esc(mName) + (tot > 0 ? ' (' + mtxt(tot) + ')' : '') + '</span>';
      } else {
        const inps = $$('.qm-shared-inp');
        const paidList = [];
        let paidSum = 0;
        inps.forEach(inp => {
          const v = N(inp.value);
          const row = $('#qm_prow_' + inp.dataset.mid);
          if (row) row.classList.toggle('active-payer', v > 0);
          if (v > 0) {
            paidSum += v;
            paidList.push(inp.dataset.mname + ' (' + fmt(v) + ')');
          }
        });
        const diff = tot - paidSum;
        if (!paidList.length) {
          pSumEl.innerHTML = '<span style="color:var(--muted)">أدخل المبلغ أمام كل شخص دفع</span>';
        } else if (Math.abs(diff) <= 0.01 && tot > 0) {
          pSumEl.innerHTML = '<span style="color:var(--ok)">✓ الدافعون: ' + esc(paidList.join(' + ')) + ' = ' + mtxt(paidSum) + '</span>';
        } else {
          pSumEl.innerHTML = '<span style="color:var(--warn)">الدافعون: ' + esc(paidList.join(' + ')) + ' (الفرق: ' + mtxt(diff) + ')</span>';
        }
      }
    }

    if (shSumEl) {
      const partCnt = $$('#qm_part_chips .chip.on').length;
      if (!partCnt) shSumEl.innerHTML = '<span style="color:var(--danger)">اختر مشاركاً واحداً على الأقل</span>';
      else if (tot > 0) shSumEl.innerHTML = 'المشاركون: ' + partCnt + ' · حصة الفرد: <span class="num">' + fmt(tot / partCnt, 2) + '</span> ' + CUR;
      else shSumEl.innerHTML = 'المشاركون: ' + partCnt;
    }
  },

  saveQuickMeal(mode, editId) {
    const room = Eng.activeRoom();
    if (!room) return;
    const desc = (($('#qm_desc') || {}).value || '').trim();
    const tot = N(($('#qm_total') || {}).value);
    const date = ($('#qm_date') || {}).value || todayISO();

    if (!desc) { toast('حدد اسم الوجبة', 'e'); return; }
    if (tot <= 0) { toast('أدخل المبلغ', 'e'); return; }

    let payers = [];
    if (this._qmPayerMode === 'me') {
      payers = [{ memberId: this._qmMeId, amount: tot }];
    } else if (this._qmPayerMode === 'other') {
      payers = [{ memberId: this._qmOtherId, amount: tot }];
    } else {
      $$('.qm-shared-inp').forEach(inp => {
        const v = N(inp.value);
        if (v > 0) payers.push({ memberId: inp.dataset.mid, amount: v });
      });
      const pSum = sum(payers, p => p.amount);
      if (Math.abs(pSum - tot) > 0.05) {
        toast('مجموع الدافعين (' + fmt(pSum) + ') لا يطابق الإجمالي (' + fmt(tot) + ')', 'e');
        return;
      }
    }

    if (mode === 'stage') {
      (room.stagedMeals || (room.stagedMeals = [])).push({
        id: 'stg_' + uid(),
        date,
        description: desc,
        category: desc,
        total: tot,
        method: 'cash',
        payers
      });
      this.close();
      commit('أُضيفت «' + desc + '» إلى الدفتر');
      return;
    }

    const participants = $$('#qm_part_chips .chip.on').map(c => c.dataset.mid);
    if (!participants.length) { toast('اختر المشاركين', 'e'); return; }

    const rec = {
      id: editId || ('it_' + uid()),
      sessionId: room.activeSessionId && room.activeSessionId !== 'all' ? room.activeSessionId : ((room.sessions[0] && room.sessions[0].id) || 'ses_1'),
      date,
      description: desc,
      category: desc,
      total: tot,
      method: 'cash',
      tags: [],
      payers,
      participants,
      settledCycle: false,
      recordedBy: (S.user && S.user.name) || 'أنا'
    };

    if (editId) {
      const idx = (room.items || []).findIndex(x => x.id === editId);
      if (idx > -1) room.items[idx] = rec;
    } else {
      (room.items || (room.items = [])).push(rec);
    }
    this.close();
    commit(editId ? 'تم التحديث' : 'تم توزيع الوجبة فوراً');
  },

  /* ── 2. نافذة توزيع الوجبات المجمّعة في الدفتر ── */
  uzbaDistributeStaged() {
    const room = Eng.activeRoom();
    if (!room || !(room.stagedMeals || []).length) return;
    const staged = room.stagedMeals;
    const totalStaged = sum(staged, m => m.total);

    const payerTotals = {};
    staged.forEach(m => {
      (m.payers || []).forEach(p => {
        payerTotals[p.memberId] = (payerTotals[p.memberId] || 0) + N(p.amount);
      });
    });

    const defParts = (room.members || []).filter(m => m.active && m.isPermanent).map(m => m.id);

    this.open({
      t: 'توزيع الدفتر (' + staged.length + ' وجبات)',
      sub: 'الإجمالي: ' + mtxt(totalStaged),
      i: 'i-checkc', ctx: 'uzba',
      b: '<div class="stack">' +
        '<div style="background:var(--surface-2);padding:10px 12px;border-radius:11px;border:1px solid var(--border-soft)">' +
          '<b style="font-size:12px;display:block;margin-bottom:6px">ما قدّمه كل شخص:</b>' +
          '<div class="chips">' +
            Object.keys(payerTotals).map(mid =>
              '<span class="badge b-ok" style="font-size:11.5px;padding:4px 10px">' + esc(Eng.memberName(room, mid)) + ': ' + mtxt(payerTotals[mid]) + '</span>'
            ).join('') +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<label>المشاركون لتوزيع (' + mtxt(totalStaged) + ') بالتساوي:</label>' +
          '<div class="chips" id="dist_part_chips">' +
            (room.members || []).map(m => {
              const on = defParts.indexOf(m.id) > -1;
              return '<button type="button" class="chip ' + (on ? 'on' : '') + '" data-mid="' + esc(m.id) + '" onclick="this.classList.toggle(\'on\');Modals.syncDistributeCalc(' + totalStaged + ')">' +
                esc(m.name) + (!m.isPermanent ? ' (ضيف)' : '') +
              '</button>';
            }).join('') +
          '</div>' +
          '<div class="hint" id="dist_share_preview" style="font-weight:700;color:var(--uzba);margin-top:6px"></div>' +
        '</div>' +
      '</div>',
      f: '<button class="btn primary" onclick="Modals.confirmDistributeStaged()">' + ico('i-check') + 'اعتماد التوزيع</button>' +
         '<button class="btn" onclick="Modals.close()">إلغاء</button>'
    });
    this.syncDistributeCalc(totalStaged);
  },

  syncDistributeCalc(totalStaged) {
    const cnt = $$('#dist_part_chips .chip.on').length;
    const el = $('#dist_share_preview');
    if (!el) return;
    if (!cnt) el.innerHTML = '<span style="color:var(--danger)">اختر مشاركاً واحداً على الأقل</span>';
    else el.innerHTML = 'المشاركون: ' + cnt + ' · حصة الفرد: <span class="num">' + fmt(totalStaged / cnt, 2) + '</span> ' + CUR;
  },

  confirmDistributeStaged() {
    const room = Eng.activeRoom();
    if (!room) return;
    const parts = $$('#dist_part_chips .chip.on').map(c => c.dataset.mid);
    if (!parts.length) { toast('اختر المشاركين', 'e'); return; }
    const sesId = room.activeSessionId && room.activeSessionId !== 'all' ? room.activeSessionId : ((room.sessions[0] && room.sessions[0].id) || 'ses_1');

    (room.stagedMeals || []).forEach(m => {
      room.items.push({
        id: 'it_' + uid(),
        sessionId: sesId,
        date: m.date || todayISO(),
        description: m.description,
        category: m.category || 'عام',
        total: N(m.total),
        method: m.method || 'cash',
        tags: ['دفتر_مجمع'],
        payers: m.payers || [],
        participants: parts.slice(),
        settledCycle: false,
        recordedBy: (S.user && S.user.name) || 'أنا'
      });
    });
    room.stagedMeals = [];
    this.close();
    commit('تم توزيع وجبات الدفتر');
  },

  uzbaDistributeSingleStaged(stagedId) {
    const room = Eng.activeRoom();
    if (!room) return;
    const idx = (room.stagedMeals || []).findIndex(m => m.id === stagedId);
    if (idx === -1) return;
    const m = room.stagedMeals[idx];
    const parts = (room.members || []).filter(x => x.active && x.isPermanent).map(x => x.id);
    const sesId = room.activeSessionId && room.activeSessionId !== 'all' ? room.activeSessionId : ((room.sessions[0] && room.sessions[0].id) || 'ses_1');
    room.items.push({
      id: 'it_' + uid(),
      sessionId: sesId,
      date: m.date || todayISO(),
      description: m.description,
      category: m.category || 'عام',
      total: N(m.total),
      method: m.method || 'cash',
      tags: [],
      payers: m.payers || [],
      participants: parts,
      settledCycle: false,
      recordedBy: (S.user && S.user.name) || 'أنا'
    });
    room.stagedMeals.splice(idx, 1);
    commit('تم توزيع «' + m.description + '»');
  },

  /* ── 3. نافذة إدارة الأعضاء وغرفة العزبة ── */
  uzbaMembersManage() {
    const room = Eng.activeRoom();
    if (!room) return;
    this.open({
      t: 'أعضاء وإعدادات العزبة',
      sub: room.name + ' · الرمز: ' + room.code,
      i: 'i-users', ctx: 'uzba', wide: true,
      b: '<div class="stack">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<button class="btn primary sm" onclick="Modals.uzbaMember()">' + ico('i-plus') + 'عضو جديد</button>' +
          '<div style="display:flex;gap:6px">' +
            '<button class="btn sm" onclick="Modals.uzbaRoom(\'' + esc(room.id) + '\')">' + ico('i-edit') + 'تعديل الغرفة</button>' +
            '<button class="btn sm soft" onclick="App.copyText(\'' + esc(room.code) + '\',\'تم نسخ الرمز\')">' + ico('i-copy') + 'نسخ: ' + esc(room.code) + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="list">' + (room.members || []).map(m =>
          '<div class="list-item">' +
            '<div class="m-av">' + esc(m.name.charAt(0)) + '</div>' +
            '<div class="li-main">' +
              '<b>' + esc(m.name) + ' ' +
                (m.isPermanent ? '<span class="badge b-ok">دائم</span>' : '<span class="badge b-warn">ضيف</span>') +
                (!m.active ? ' <span class="badge b-mute">موقوف</span>' : '') +
              '</b>' +
            '</div>' +
            '<div class="row-acts">' +
              '<button onclick="UzbaAct.toggleMemberActive(\'' + m.id + '\')" title="تفعيل/إيقاف">' + ico(m.active ? 'i-check' : 'i-x') + '</button>' +
              '<button onclick="Modals.uzbaMember(\'' + m.id + '\')" title="تعديل">' + ico('i-edit') + '</button>' +
              '<button class="del" onclick="UzbaAct.deleteMember(\'' + m.id + '\')" title="حذف">' + ico('i-trash') + '</button>' +
            '</div>' +
          '</div>'
        ).join('') + '</div>' +
      '</div>',
      f: '<button class="btn" onclick="Modals.close()">إغلاق</button>'
    });
  },

  uzbaRoom(editId) {

  setCustodySplit(custom) {
    this._custodyCustomSplit = !!custom;
    $('#m_ce_sp_all').classList.toggle('on', !custom);
    $('#m_ce_sp_custom').classList.toggle('on', !!custom);
    $('#m_ce_split_box').style.display = custom ? 'grid' : 'none';
    if (custom) {
      const tot = N(($('#m_ce_total') || {}).value);
      $('#m_ce_s_fund').value = tot || 0;
      $('#m_ce_s_me').value = 0;
      $('#m_ce_s_other').value = 0;
    }
    this.syncCustodySplit();
  },

  syncCustodySplit() {
    if (!this._custodyCustomSplit) return;
    const tot = N(($('#m_ce_total') || {}).value);
    const sFund = N(($('#m_ce_s_fund') || {}).value);
    const sMe = N(($('#m_ce_s_me') || {}).value);
    const sOther = N(($('#m_ce_s_other') || {}).value);
    const diff = tot - (sFund + sMe + sOther);
    const h = $('#m_ce_split_hint');
    if (h) {
      if (Math.abs(diff) <= 0.01 && tot > 0) h.innerHTML = '<b style="color:var(--ok)">✓ مطابق (' + mtxt(tot) + ')</b>';
      else h.innerHTML = '<b style="color:var(--danger)">الفرق: ' + mtxt(diff) + '</b>';
    }
  },

  saveCustodyEntry(fundId, dir) {
    const fd = (S.custody.funds || []).find(f => f.id === fundId);
    const tot = N(($('#m_ce_total') || {}).value);
    const date = ($('#m_ce_date') || {}).value || todayISO();
    const party = (($('#m_ce_party') || {}).value || '').trim();
    const method = ($('#m_ce_method') || {}).value || 'transfer';
    const cat = ($('#m_ce_cat') || {}).value || 'عام';
    const purpose = (($('#m_ce_purpose') || {}).value || '').trim();

    if (tot <= 0 || !party) { toast('أدخل الاسم والمبلغ', 'e'); return; }

    let fundAmt = tot, meAmt = 0, otherAmt = 0;
    if (this._custodyCustomSplit) {
      fundAmt = N(($('#m_ce_s_fund') || {}).value);
      meAmt = N(($('#m_ce_s_me') || {}).value);
      otherAmt = N(($('#m_ce_s_other') || {}).value);
      if (Math.abs(tot - (fundAmt + meAmt + otherAmt)) > 0.05) {
        toast('مجموع التوزيع لا يطابق الإجمالي', 'e');
        return;
      }
    }

    if (fundAmt > 0) {
      fd.entries.push({
        id: 'ce_' + uid(), date, dir, amount: fundAmt, party, purpose: purpose || cat, method, category: cat,
        note: ''
      });
    }
    if (meAmt > 0) {
      const wId = ($('#m_ce_s_wallet') || {}).value || 'cash';
      S.personal.transactions.push({
        id: 'tx_' + uid(), date, kind: dir === 'in' ? 'in' : 'out', amount: meAmt,
        category: dir === 'in' ? 'عمولة توزيع' : 'مشتريات',
        walletId: wId, method,
        description: 'حصة من (' + party + ')', tags: ['مشترك']
      });
    }
    if (otherAmt > 0) {
      const otherId = ($('#m_ce_s_other_id') || {}).value;
      const otherFd = (S.custody.funds || []).find(f => f.id === otherId);
      if (otherFd) {
        otherFd.entries.push({
          id: 'ce_' + uid(), date, dir, amount: otherAmt, party, purpose: 'تحويل مشترك', method, category: cat, note: ''
        });
      }
    }
    this.close();

    const wId = ($('#m_tx_wallet') || {}).value || 'cash';
    const rec = {
      id: editId || ('tx_' + uid()),

      amount: amt,

/* ═══════════════════════════════════════════════════════════════════════════
   §14  مزامنة العزبة عبر Supabase (AES-GCM مشفرة + خاصة بالعزبة فقط)
   ═══════════════════════════════════════════════════════════════════════════ */
const UzbaSync = {
  _pushTimer: null,
  SQL_SCRIPT: `create table if not exists public.uzba_rooms (
  room_code text primary key,
  payload text not null,
  updated_by text,
  updated_at timestamptz default now()
);
alter table public.uzba_rooms enable row level security;
create policy "Allow public access by room_code" on public.uzba_rooms
  for all using (true) with check (true);`,

  readInputs() {
    if ($('#st_sb_url')) S.settings.supabase.url = ($('#st_sb_url').value || '').trim().replace(/\/+$/, '');
    if ($('#st_sb_key')) S.settings.supabase.anonKey = ($('#st_sb_key').value || '').trim();
    if ($('#st_sb_code')) {
      const code = ($('#st_sb_code').value || '').trim() || 'UZBA-2026';
      S.settings.supabase.roomCode = code;
      const r = Eng.activeRoom();
      if (r) r.code = code;
    }
    save(true);
  },

  async saveAndTest() {
    this.readInputs();
    const sb = S.settings.supabase;
    if (!sb.url || !sb.anonKey) {
      toast('أدخل الرابط والمفتاح أولاً', 'e');
      return;
    }
    try {
      const res = await fetch(sb.url + '/rest/v1/uzba_rooms?select=room_code&limit=1', {
        headers: { apikey: sb.anonKey, Authorization: 'Bearer ' + sb.anonKey }
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      toast('الاتصال ناجح!', 's');
    } catch (e) {
      toast('تعذر الاتصال — راجع الرابط والمفتاح', 'e');
    }
  },

  async deriveKey(roomCode) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(roomCode), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: enc.encode('smartfin-uzba-v1'), iterations: 50000, hash: 'SHA-256' },
      baseKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
    );
  },

  async encryptPayload(obj, roomCode) {
    const json = JSON.stringify(obj);
    if (!window.crypto || !window.crypto.subtle) return json;
    try {
      const key = await this.deriveKey(roomCode);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(json));
      const combined = new Uint8Array(12 + ct.byteLength);
      combined.set(iv, 0);
      combined.set(new Uint8Array(ct), 12);
      let bin = '';
      for (let i = 0; i < combined.length; i++) bin += String.fromCharCode(combined[i]);
      return 'ENC1:' + btoa(bin);
    } catch (e) { return json; }
  },

  async decryptPayload(raw, roomCode) {
    if (!raw || typeof raw !== 'string') return null;
    if (raw.indexOf('ENC1:') !== 0) return JSON.parse(raw);
    const bin = atob(raw.slice(5));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const iv = bytes.slice(0, 12), ct = bytes.slice(12);
    const key = await this.deriveKey(roomCode);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    return JSON.parse(new TextDecoder().decode(plain));
  },

  async pushRoom() {
    this.readInputs();
    const sb = S.settings.supabase;
    const room = Eng.activeRoom();
    if (!sb.url || !sb.anonKey || !room) {
      toast('أكمل إعدادات Supabase أولاً', 'e');
      return;
    }
    try {
      const encrypted = await this.encryptPayload(room, room.code);
      const body = {
        room_code: room.code,
        payload: encrypted,
        updated_by: S.user.name || 'عضو',
        updated_at: new Date().toISOString()
      };
      const res = await fetch(sb.url + '/rest/v1/uzba_rooms', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          apikey: sb.anonKey,
          Authorization: 'Bearer ' + sb.anonKey,
          Prefer: 'resolution=merge-duplicates'
        },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      sb.lastSync = dShort(todayISO()) + ' ' + new Date().toTimeString().slice(0, 5);
      try { localStorage.removeItem(SYNC_PENDING_KEY); } catch (e) {}
      save(true);
      toast('تم رفع بيانات العزبة', 's');
    } catch (e) {
      toast('تعذر الرفع', 'e');
    }
  },

  async pullRoom() {
    this.readInputs();
    const sb = S.settings.supabase;
    const room = Eng.activeRoom();
    if (!sb.url || !sb.anonKey || !room) {
      toast('أكمل إعدادات Supabase أولاً', 'e');
      return;
    }
    try {
      const res = await fetch(sb.url + '/rest/v1/uzba_rooms?room_code=eq.' + encodeURIComponent(room.code) + '&select=*', {
        headers: { apikey: sb.anonKey, Authorization: 'Bearer ' + sb.anonKey }
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();
      if (!rows || !rows.length) {
        toast('لا توجد بيانات مرفوعة لهذا الرمز بعد', 'i');
        return;
      }
      const remoteRoom = await this.decryptPayload(rows[0].payload, room.code);
      if (remoteRoom && remoteRoom.members) {
        S.uzba.rooms[0] = remoteRoom;
        S.uzba.activeRoomId = remoteRoom.id;
        sb.lastSync = dShort(todayISO()) + ' ' + new Date().toTimeString().slice(0, 5);
        commit('تم جلب بيانات العزبة');
      }
    } catch (e) {
      toast('تعذر الجلب', 'e');
    }
  },

  scheduleAutoPush() {
    clearTimeout(this._pushTimer);
    this._pushTimer = setTimeout(() => {
      if (S.settings.supabase && S.settings.supabase.url && navigator.onLine) {
        this.pushRoom();
      }
    }, 2500);
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   §15  محرر النصوص الظاهرة في النظام (Txt)
   ═══════════════════════════════════════════════════════════════════════════ */
const Txt = {
  apply(root) {
    const map = (S && S.ui && S.ui.texts) || {};
    if (!root || !Object.keys(map).length) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    let n;
    while ((n = walker.nextNode())) {
      const k = (n.nodeValue || '').trim();
      if (k && map[k]) n.nodeValue = n.nodeValue.replace(k, map[k]);
    }
  },
  openEditor() {
    const map = (S.ui.texts || (S.ui.texts = {}));
    const defaults = [
      'إضافة سريعة', 'الخزينة الشخصية', 'خزينة العزبة', 'أموال الغير',
      'أرصدة الأعضاء', 'التسوية الذكية', 'الرصيد المقدَّم عند شخص',
      'دَينٌ لك (عند الآخرين)', 'دَينٌ عليك (للآخرين)'
    ];
    Modals.open({
      t: 'تحرير نصوص النظام',
      sub: '',
      i: 'i-edit', ctx: 'neutral', wide: true,
      b: '<div class="fgrid">' + defaults.map(k =>
        '<div class="field"><label>«' + esc(k) + '»</label>' +
          '<input type="text" class="txt-ed-inp" data-orig="' + esc(k) + '" value="' + esc(map[k] || k) + '">' +
        '</div>'
      ).join('') + '</div>',
      f: '<button class="btn primary" onclick="Txt.saveEditor()">' + ico('i-check') + 'حفظ</button>' +
         '<button class="btn danger" onclick="S.ui.texts={};commit(\'تمت الاستعادة\');Modals.close()">استعادة الافتراضي</button>'
    });
  },
  saveEditor() {
    const map = {};
    $$('.txt-ed-inp').forEach(inp => {
      const orig = inp.dataset.orig;
      const val = (inp.value || '').trim();
      if (val && val !== orig) map[orig] = val;
    });
    S.ui.texts = map;
    Modals.close();
    commit('تم تحديث النصوص');
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   §16  المتحكم الرئيسي بالتطبيق + PWA (App)
   ═══════════════════════════════════════════════════════════════════════════ */
const NAV_TABS = [
  { k: 'home',     t: 'الرئيسية',    s: 'الرئيسية',    i: 'i-home',    c: 'var(--brand)',    bg: 'var(--brand-soft)',    ctx: 'neutral' },
  { k: 'uzba',     t: 'العزبة',      s: 'العزبة',      i: 'i-uzba',    c: 'var(--uzba)',     bg: 'var(--uzba-soft)',     ctx: 'uzba' },
  { k: 'custody',  t: 'أموال الغير', s: 'أموال الغير', i: 'i-custody', c: 'var(--custody)',  bg: 'var(--custody-soft)',  ctx: 'custody' },
  { k: 'treasury', t: 'الخزينة',     s: 'الخزينة',     i: 'i-wallet',  c: 'var(--treasury)', bg: 'var(--treasury-soft)', ctx: 'treasury' },
  { k: 'debts',    t: 'الديون',      s: 'الديون',      i: 'i-debts',   c: 'var(--debts)',    bg: 'var(--debts-soft)',    ctx: 'debts' },
  { k: 'reports',  t: 'التقارير',    s: 'التقارير',    i: 'i-chart',   c: 'var(--brand)',    bg: 'var(--brand-soft)',    ctx: 'neutral' }
];

const App = {
  _suppressPop: false,
  _navStack: [],

  init() {
    /* 1. كسر التخزين المؤقت والتحقق من التحديثات الجديدة عند فتح التطبيق */
    this.checkAppUpdate();
    /* 2. منع التكبير العشوائي باللمس المزدوج أو القرص على الجوال */
    this.preventRandomTouchZoom();
    /* 3. تهيئة تطبيق الجوال PWA */
    this.setupPWA();
    /* 4. تفعيل سجل المتصفح وزر الرجوع في الجوال (History API) */
    this.setupHistoryNavigation();

    /* 5. المزامنة التلقائية في الخلفية مع Supabase فور توفر الإنترنت */
    const syncWhenOnline = () => {
      if (navigator.onLine && S.settings && S.settings.supabase && S.settings.supabase.url && S.settings.supabase.autoSync !== false) {
        UzbaSync.pushRoom();
      }
    };
    window.addEventListener('online', syncWhenOnline);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        this.checkAppUpdate();
        if (localStorage.getItem(SYNC_PENDING_KEY) === '1') syncWhenOnline();
      }
    });

    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') { Modals.close(); Modals.closeConfirm(); }
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.smart-date-wrap')) {
        $$('.smart-date-pop.on').forEach(p => p.classList.remove('on'));
      }
      if (!e.target.closest('.sort-wrap')) {
        $$('.sort-pop.on').forEach(p => p.classList.remove('on'));
      }
    });

    /* 6. قراءة البيانات من منظومة التخزين المزدوجة (IndexedDB للمدخلات + LocalStorage للإعدادات) */
    return Store.boot().then(() => Store.read()).then(saved => {
      const def = defaultState();
      if (saved && typeof saved === 'object' && saved.uzba && saved.personal) {
        S = Object.assign(def, saved);
        S.ui = Object.assign(def.ui, saved.ui || {});
        S.ui.homeWidgets = Object.assign(def.ui.homeWidgets, (saved.ui && saved.ui.homeWidgets) || {});
        S.settings = Object.assign(def.settings, saved.settings || {});
        S.settings.modules = Object.assign(def.settings.modules, (saved.settings && saved.settings.modules) || {});
        if (S.uzba && S.uzba.rooms && S.uzba.rooms[0] && !Array.isArray(S.uzba.rooms[0].stagedMeals)) {
          S.uzba.rooms[0].stagedMeals = def.uzba.rooms[0].stagedMeals;
        }
      } else {
        S = def;
      }

      /* استرجاع أحدث الإعدادات المحفوظة في LocalStorage */
      try {
        const lsUi = JSON.parse(localStorage.getItem(UI_KEY) || 'null');
        if (lsUi && typeof lsUi === 'object') S.ui = Object.assign(S.ui, lsUi);
        const lsSet = JSON.parse(localStorage.getItem(SET_KEY) || 'null');
        if (lsSet && typeof lsSet === 'object') {
          if (lsSet.user) S.user = Object.assign(S.user, lsSet.user);
          if (lsSet.settings) S.settings = Object.assign(S.settings, lsSet.settings);
        }
      } catch (e) {}

      Store.write(S);
      this.applyTheme(S.ui.theme || 'light');
      if (S.user && S.user.requirePin && S.user.pinHash) {
        $('#lockWelcome').textContent = 'مرحباً بك يا ' + (S.user.name || 'أحمد');
        $('#lockScreen').classList.add('on');
      }
      this.render();
      if (localStorage.getItem(SYNC_PENDING_KEY) === '1') syncWhenOnline();
    });
  },

  /** كود كسر التخزين المؤقت (Cache Busting) للتحقق من وجود تحديث جديد عند فتح التطبيق */
  async checkAppUpdate() {
    try {
      const VER_KEY = 'smartfin.build_version';
      const prevVer = localStorage.getItem(VER_KEY);
      if (prevVer && prevVer !== APP_BUILD_VERSION) {
        localStorage.setItem(VER_KEY, APP_BUILD_VERSION);
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        toast('تم تحديث النظام إلى أحدث نسخة', 'i');
      } else if (!prevVer) {
        localStorage.setItem(VER_KEY, APP_BUILD_VERSION);
      }

      /* التحقق من وجود نسخة أحدث على الخادم عند العمل عبر HTTP/HTTPS */
      if (navigator.onLine && (location.protocol === 'https:' || location.protocol === 'http:')) {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          regs.forEach(r => { try { r.update(); } catch (e) {} });
        }
        const res = await fetch(location.pathname + '?_cb=' + Date.now(), {
          method: 'HEAD',
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
        }).catch(() => null);
        if (res && res.ok) {
          const etag = res.headers.get('etag') || res.headers.get('last-modified') || '';
          const ETAG_KEY = 'smartfin.server_etag';
          const oldEtag = localStorage.getItem(ETAG_KEY);
          if (etag && oldEtag && oldEtag !== etag) {
            localStorage.setItem(ETAG_KEY, etag);
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map(k => caches.delete(k)));
            }
            location.reload();
          } else if (etag) {
            localStorage.setItem(ETAG_KEY, etag);
          }
        }
      }
    } catch (e) {}
  },

  /** منع التكبير العشوائي باللمس المزدوج أو القرص على الجوال */
  preventRandomTouchZoom() {
    document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
    document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
    document.addEventListener('touchmove', e => {
      if (e.touches && e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouchEnd <= 280) {
        if (!e.target || !e.target.closest('input, textarea, select')) {
          e.preventDefault();
        }
      }
      lastTouchEnd = now;
    }, { passive: false });
  },

  /** ربط التنقل بين النوافذ والأقسام بسجل المتصفح ومعالجة زر الرجوع في الجوال (History API) */
  pushHistoryState(stateObj) {
    try {
      if (window.history && window.history.pushState) {
        window.history.pushState(stateObj, '', '');
      }
    } catch (e) {}
  },

  setupHistoryNavigation() {
    try {
      const initTab = (S && S.ui && S.ui.tab) || 'home';
      const initSub = (S && S.ui && S.ui.sub && S.ui.sub[initTab]) || '';
      if (window.history && window.history.replaceState) {
        window.history.replaceState({ tab: 'home', sub: '', rootGuard: true }, '', '');
        this.pushHistoryState({ tab: initTab, sub: initSub });
      }
    } catch (e) {}

    window.addEventListener('popstate', e => {
      if (this._suppressPop) {
        this._suppressPop = false;
        return;
      }

      /* 1. إذا كانت نافذة التأكيد مفتوحة، أغلقها أولاً */
      if ($('#confirm') && $('#confirm').classList.contains('on')) {
        Modals.closeConfirm(true);
        return;
      }

      /* 2. إذا كانت أي نافذة منبثقة مفتوحة، أغلقها وابقَ في نفس الشاشة */
      if ($('#modal') && $('#modal').classList.contains('on')) {
        Modals.close(true);
        return;
      }

      /* 3. إذا كانت هناك قائمة تاريخ أو فرز منسدلة مفتوحة، أغلقها */
      const openPops = $$('.smart-date-pop.on, .sort-pop.on');
      if (openPops.length > 0) {
        openPops.forEach(p => p.classList.remove('on'));
        this.pushHistoryState({ tab: S.ui.tab, sub: (S.ui.sub && S.ui.sub[S.ui.tab]) || '' });
        return;
      }

      /* 4. الرجوع إلى القسم أو التبويب الفرعي السابق داخل النظام بدلاً من إغلاق التطبيق */
      const st = e.state;
      if (st && st.tab) {
        S.ui.tab = st.tab;
        if (st.sub) {
          S.ui.sub = S.ui.sub || {};
          S.ui.sub[st.tab] = st.sub;
        }
        save();
        this.render();
        if (st.rootGuard) {
          /* إبقاء حاجز حماية في السجل حتى لا يخرج زر الرجوع في الجوال من التطبيق فجأة */
          this.pushHistoryState({ tab: S.ui.tab, sub: (S.ui.sub && S.ui.sub[S.ui.tab]) || '' });
        }
      } else if (S.ui.tab !== 'home') {
        S.ui.tab = 'home';
        save();
        this.render();
        this.pushHistoryState({ tab: 'home', sub: '' });
      } else {
        this.pushHistoryState({ tab: 'home', sub: '' });
      }
    });
  },

  /* التحكم بحقل التاريخ الذكي المختصر */
  toggleSmartDatePop(id) {
    const pop = $('#' + id + '_pop');
    if (!pop) return;
    const isOn = pop.classList.contains('on');
    $$('.smart-date-pop.on').forEach(p => p.classList.remove('on'));
    if (!isOn) pop.classList.add('on');
  },

  setSmartDate(id, val) {
    if (!val) return;
    const inp = $('#' + id);
    const lbl = $('#' + id + '_lbl');
    const pop = $('#' + id + '_pop');
    if (inp) inp.value = val;
    if (lbl) lbl.textContent = smartDateLabel(val);
    if (pop) pop.classList.remove('on');
  },

  /* التحكم بقائمة الفترة المنسدلة في أرصدة أعضاء العزبة */
  togglePeriodPop() {
    const pop = $('#uzba_period_pop');
    if (!pop) return;
    const isOn = pop.classList.contains('on');
    $$('.sort-pop.on').forEach(p => p.classList.remove('on'));
    if (!isOn) pop.classList.add('on');
  },

  /* التحكم بقائمة الفرز المنسدلة */
  toggleSortPop(secKey) {
    const pop = $('#sort_pop_' + secKey);
    if (!pop) return;
    const isOn = pop.classList.contains('on');
    $$('.sort-pop.on').forEach(p => p.classList.remove('on'));
    if (!isOn) pop.classList.add('on');
  },

  /* إنجاز وإخفاء التنبيه عند الضغط عليه وإعادة أيقونة الجرس لوضعها الطبيعي */
  resolveAlert(alertId, goTab, goSub) {
    if (!S.settings) S.settings = {};
    if (!Array.isArray(S.settings.dismissedAlerts)) S.settings.dismissedAlerts = [];
    if (alertId && S.settings.dismissedAlerts.indexOf(alertId) === -1) {
      S.settings.dismissedAlerts.push(alertId);
    }
    save(true);
    this.render();
    if (goTab) {
      Modals.close();
      if (goTab === 'settings') Modals.settings('backup');
      else this.go(goTab, goSub || '');
      toast('تم إنجاز التنبيه', 's');
    } else {
      if ($('#modal').classList.contains('on')) Modals.alerts();
      toast('تم إنجاز التنبيه وإخفاؤه', 's');
    }
  },

  resolveAllAlerts() {
    if (!S.settings) S.settings = {};
    if (!Array.isArray(S.settings.dismissedAlerts)) S.settings.dismissedAlerts = [];
    Eng.alerts().forEach(a => {
      if (S.settings.dismissedAlerts.indexOf(a.id) === -1) {
        S.settings.dismissedAlerts.push(a.id);
      }
    });
    save(true);
    this.render();
    if ($('#modal').classList.contains('on')) Modals.alerts();
    toast('تم إنجاز جميع التنبيهات', 's');
  },

  restoreDismissedAlerts() {
    if (S.settings) S.settings.dismissedAlerts = [];
    save(true);
    this.render();
    if ($('#modal').classList.contains('on')) Modals.alerts();
    toast('تمت استعادة التنبيهات', 'i');
  },

  /* تخصيص أيقونة النظام أو الصورة الشخصية */
  setAppIcon(iconKey) {
    S.ui.appIcon = iconKey;
    S.ui.appIconImage = '';
    save(true);
    this.renderBrandIcon();
    Modals.settings('appearance');
    toast('تم تحديث أيقونة النظام', 's');
  },

  setAppIconBg(bgKey) {
    S.ui.appIconBg = bgKey;
    save(true);
    this.renderBrandIcon();
    Modals.settings('appearance');
  },

  uploadAppIconImage(input) {
    const file = input && input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = 192; c.height = 192;
        const ctx = c.getContext('2d');
        const minSide = Math.min(img.width, img.height);
        const sx = (img.width - minSide) / 2;
        const sy = (img.height - minSide) / 2;
        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, 192, 192);
        S.ui.appIconImage = c.toDataURL('image/png', 0.9);
        save(true);
        this.renderBrandIcon();
        Modals.settings('appearance');
        toast('تم وضع صورتك كأيقونة للنظام', 's');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    input.value = '';
  },

  clearAppIconImage() {
    S.ui.appIconImage = '';
    save(true);
    this.renderBrandIcon();
    Modals.settings('appearance');
    toast('تمت استعادة الأيقونة الافتراضية', 'i');
  },

  renderBrandIcon() {
    const iconMap = {
      crest: 'i-crest', wallet: 'i-wallet', cash: 'i-cash',
      bank: 'i-bank', uzba: 'i-uzba', chart: 'i-chart'
    };
    const bgMap = {
      royal:    '#1e40af',
      emerald:  'linear-gradient(135deg,#059669,#0284c7)',
      amber:    'linear-gradient(135deg,#ea580c,#d97706)',
      ocean:    'linear-gradient(135deg,#0284c7,#4f46e5)',
      midnight: 'linear-gradient(135deg,#0f172a,#334155)'
    };
    const ic = iconMap[(S.ui && S.ui.appIcon) || 'crest'] || 'i-crest';
    const bg = bgMap[(S.ui && S.ui.appIconBg) || 'royal'] || bgMap.royal;
    const customImg = (S.ui && S.ui.appIconImage) || '';

    const html = customImg ? '<img src="' + esc(customImg) + '" alt="أيقونة النظام">' : ico(ic);
    ['hdrBrandMark', 'lockBrandMark'].forEach(id => {
      const el = $('#' + id);
      if (el) {
        el.style.background = bg;
        el.innerHTML = html;
      }
    });

    /* تحديث أيقونة المتصفح وتطبيق الجوال (Favicon & Apple Touch Icon) */
    const fav = $('#appFavicon'), touch = $('#appTouchIcon');
    const iconUrl = customImg || ('data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0%" stop-color="#4f46e5"/><stop offset="55%" stop-color="#ea580c"/><stop offset="100%" stop-color="#059669"/>' +
      '</linearGradient></defs>' +
      '<rect width="120" height="120" rx="28" fill="url(#g)"/>' +
      '<polygon points="60 18 100 44 100 76 60 102 20 76 20 44 60 18" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>' +
      '<circle cx="60" cy="60" r="12" fill="#fff"/>' +
      '</svg>'
    ));
    if (fav) fav.href = iconUrl;
    if (touch) touch.href = iconUrl;
  },

  setListSort(secKey, mode) {
    if (secKey === 'uzba') UzbaAct.sortMode = mode;
    else if (secKey === 'custody') CustodyAct.sortMode = mode;
    $$('.sort-pop.on').forEach(p => p.classList.remove('on'));
    this.render();
  },

  unlockPin() {
    const pin = (($('#lockPinInput') || {}).value || '').trim();
    if (simpleHash(pin) === S.user.pinHash) {
      $('#lockScreen').classList.remove('on');
      toast('مرحباً بك يا ' + S.user.name, 's');
    } else {
      toast('الرمز غير صحيح', 'e');
    }
  },

  applyTheme(theme) {
    theme = theme === 'dark' ? 'dark' : 'light';
    S.ui.theme = theme;
    document.documentElement.dataset.theme = theme;
    const mc = $('#metaThemeColor');
    if (mc) mc.content = theme === 'dark' ? '#0a0f1c' : '#f8fafc';
    const icoEl = $('#hdrThemeIco');
    if (icoEl) icoEl.setAttribute('href', theme === 'dark' ? '#i-sun' : '#i-moon');
  },

  toggleTheme() {
    this.applyTheme(S.ui.theme === 'dark' ? 'light' : 'dark');
    save(true);
    this.render();
  },

  toggleHideNumbers() {
    S.ui.hideNumbers = !S.ui.hideNumbers;
    save(true);
    this.render();
    toast(S.ui.hideNumbers ? 'تم إخفاء الأرقام الأساسية' : 'تم إظهار الأرقام الأساسية', 'i');
  },

  toggleModule(modKey) {
    const M = S.settings.modules || (S.settings.modules = {});
    const activeList = NAV_TABS.filter(t => M[t.k] !== false);
    if (M[modKey] !== false && activeList.length <= 1) {
      toast('يجب إبقاء قسم واحد على الأقل', 'e');
      return;
    }
    M[modKey] = !(M[modKey] !== false);
    if (M[S.ui.tab] === false) {
      const firstOn = NAV_TABS.find(t => M[t.k] !== false);
      if (firstOn) S.ui.tab = firstOn.k;
    }
    commit('تم التحديث');
    Modals.settings('modules');
  },

  go(tab, sub) {
    const prevTab = S.ui.tab;
    const prevSub = (S.ui.sub && S.ui.sub[tab]) || '';
    S.ui.tab = tab;
    if (sub) {
      S.ui.sub = S.ui.sub || {};
      S.ui.sub[tab] = sub;
    }
    const curSub = (S.ui.sub && S.ui.sub[tab]) || '';
    if (prevTab !== tab || (sub && prevSub !== curSub)) {
      this.pushHistoryState({ tab, sub: curSub });
    }
    save();
    this.render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  },

  setSub(tab, sub) {
    S.ui.sub = S.ui.sub || {};
    const prevSub = S.ui.sub[tab] || '';
    S.ui.sub[tab] = sub;
    if (prevSub !== sub) {
      this.pushHistoryState({ tab, sub });
    }
    save();
    this.render();
  },

  render() {
    const M = (S.settings && S.settings.modules) || {};
    const visibleTabs = NAV_TABS.filter(t => M[t.k] !== false);
    let curTab = S.ui.tab || 'home';
    if (!visibleTabs.some(t => t.k === curTab)) curTab = visibleTabs[0].k;
    S.ui.tab = curTab;
    const meta = visibleTabs.find(t => t.k === curTab) || NAV_TABS[0];

    document.body.className = 'ctx-' + meta.ctx;
    $('#hdrTitle').textContent = S.ui.headerTitle || 'النظام المالي الذكي';
    $('#hdrUserPill').textContent = '👤 ' + (S.user && S.user.name ? S.user.name : 'أحمد');

    this.renderBrandIcon();

    const alerts = Eng.alerts();
    const alertBtn = $('#hdrAlertsBtn');
    const dot = $('#hdrNotifDot');
    if (alertBtn) alertBtn.classList.toggle('has-alerts', alerts.length > 0);
    if (dot) {
      dot.style.display = alerts.length > 0 ? 'inline-block' : 'none';
      dot.textContent = alerts.length;
    }

    $('#tabs').innerHTML = visibleTabs.map(t =>
      '<button class="tab ' + (t.k === curTab ? 'on' : '') + '" style="--tab-c:' + t.c + ';--tab-bg:' + t.bg + '" onclick="App.go(\'' + t.k + '\')">' +
      ico(t.i) + '<span>' + esc(t.t) + '</span></button>'
    ).join('');

    $('#botnav').innerHTML = visibleTabs.map(t =>
      '<button class="' + (t.k === curTab ? 'on' : '') + '" style="--tab-c:' + t.c + '" onclick="App.go(\'' + t.k + '\')">' +
      ico(t.i) + '<span>' + esc(t.s) + '</span></button>'
    ).join('');

    renderVaultStrip();

    $$('.page').forEach(p => p.classList.remove('on'));
    const pageEl = $('#page-' + curTab);
    if (pageEl && Pages[curTab]) {
      pageEl.classList.add('on');
      Pages[curTab](pageEl);
    }

    Txt.apply(document.body);
  },

  copyText(text, msg) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      toast(msg || 'تم النسخ', 's');
    } catch (e) { toast('تعذر النسخ', 'e'); }
  },

  sendWhatsApp(phone, text) {
    const targetPhone = (phone || (S.settings && S.settings.whatsappPhone) || '').replace(/[^0-9]/g, '');
    const url = 'https://wa.me/' + targetPhone + '?text=' + encodeURIComponent(text || '');
    window.open(url, '_blank', 'noopener,noreferrer');
  },

  exportJSON() {
    S.settings.backup.lastManualDate = todayISO();
    save(true);
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'النظام-المالي-الذكي-' + todayISO() + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
    toast('تم تصدير النسخة الاحتياطية', 's');
  },

  importJSON(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data || !data.uzba || !data.personal) throw new Error('bad');
        Modals.confirm('استبدال البيانات الحالية بالنسخة المستوردة؟', () => {
          S = data;
          save(true);
          Modals.close();
          this.render();
          toast('تم الاستيراد بنجاح', 's');
        });
      } catch (err) {
        toast('الملف غير صالح', 'e');
      }
    };
    reader.readAsText(file);
    input.value = '';
  },

  resetToDemo() {
    Modals.confirm('استعادة البيانات التجريبية لجميع الأقسام؟', () => {
      S = defaultState();
      save(true);
      Modals.close();
      this.render();
      toast('تمت استعادة البيانات التجريبية', 's');
    });
  },

  clearAllData() {
    Modals.confirm('تصفير جميع العمليات والأرصدة للبدء من الصفر؟', () => {
      const myName = S.user.name || 'أحمد';
      S = defaultState();
      S.uzba.rooms[0].members = [{ id: 'm1', name: myName, isPermanent: true, active: true, phone: S.user.phone || '', joinedAt: todayISO() }];
      S.uzba.rooms[0].stagedMeals = [];
      S.uzba.rooms[0].items = [];
      S.uzba.rooms[0].vaultEntries = [];
      S.uzba.rooms[0].advances = [];
      S.uzba.rooms[0].settlements = [];
      S.custody.funds = [];
      S.custody.loans = [];
      S.personal.cashOpening = 0;
      S.personal.banks = [];
      S.personal.transactions = [];
      S.personal.transfers = [];
      S.personal.debts = { owed: [], owing: [] };
      save(true);
      Modals.close();
      this.render();
      toast('تم تصفير النظام', 's');
    });
  },

  setupPWA() {
    try {
      if (location.protocol === 'https:' || location.protocol === 'http:') {
        /* عند النشر على GitHub Pages: ربط manifest.json و icon.svg وتسجيل sw.js */
        if (!document.querySelector('link[rel="manifest"]')) {
          const link = document.createElement('link');
          link.href = './manifest.json';
          link.href = 'manifest.json';
          document.head.appendChild(link);
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
      }
    } catch (e) {}
  }
};

window.addEventListener('DOMContentLoaded', () => {
  App.init();
});
</script>
</body>
</html>
